<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegalShield AI – UK Tenancy Rights</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── DESIGN TOKENS ─────────────────────────────────────────────── */
    :root {
      --navy:      #0f1e35;
      --navy-mid:  #162a47;
      --navy-soft: #1e3a5f;
      --slate:     #4a6080;
      --slate-lt:  #7a94b0;
      --amber:     #e8a020;
      --amber-lt:  #f5c75a;
      --off-white: #f0f4f9;
      --white:     #ffffff;
      --muted:     #d0dae8;
      --success:   #2ecc8a;
      --danger:    #e85050;
      --text-body: #2c3e58;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body:    'Inter', system-ui, sans-serif;
      --radius:    10px;
      --shadow:    0 4px 24px rgba(15,30,53,0.12);
      --shadow-lg: 0 12px 48px rgba(15,30,53,0.18);
    }

    /* ── RESET & BASE ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--off-white);
      color: var(--text-body);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── LAYOUT ─────────────────────────────────────────────────────── */
    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
    .main-content { flex: 1; }

    /* ── NAVIGATION ─────────────────────────────────────────────────── */
    .nav {
      background: var(--navy);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      text-decoration: none;
    }
    .nav-shield {
      width: 32px; height: 36px;
      background: var(--amber);
      clip-path: polygon(50% 0%, 100% 15%, 100% 65%, 50% 100%, 0% 65%, 0% 15%);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      color: var(--navy);
      font-weight: 700;
      flex-shrink: 0;
    }
    .nav-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--white);
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .nav-title span { color: var(--amber); }
    .nav-disclaimer {
      font-size: 0.72rem;
      color: var(--slate-lt);
      max-width: 320px;
      text-align: right;
      display: none;
    }
    @media (min-width: 768px) { .nav-disclaimer { display: block; } }

    /* ── HERO ───────────────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(145deg, var(--navy) 0%, var(--navy-soft) 60%, #1b3d6e 100%);
      color: var(--white);
      padding: 5rem 2rem 6rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(232,160,32,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 50%, rgba(30,58,95,0.6) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-eyebrow {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--amber);
      font-weight: 600;
      margin-bottom: 1.2rem;
      position: relative;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.15;
      max-width: 720px;
      margin: 0 auto 1.2rem;
      position: relative;
    }
    .hero h1 em {
      font-style: normal;
      color: var(--amber);
      border-bottom: 2px solid var(--amber);
    }
    .hero-sub {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
      position: relative;
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 0.3rem 0.9rem;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2rem;
      position: relative;
    }
    .hero-badge::before {
      content: '●';
      color: var(--success);
      font-size: 0.5rem;
    }

    /* ── BUTTONS ────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.6rem;
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.18s ease;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--amber);
      color: var(--navy);
    }
    .btn-primary:hover { background: var(--amber-lt); box-shadow: 0 4px 20px rgba(232,160,32,0.4); }
    .btn-secondary {
      background: rgba(255,255,255,0.12);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }
    .btn-outline {
      background: transparent;
      color: var(--navy);
      border: 2px solid var(--navy);
    }
    .btn-outline:hover { background: var(--navy); color: var(--white); }
    .btn-ghost {
      background: transparent;
      color: var(--slate);
      padding: 0.5rem 1rem;
    }
    .btn-ghost:hover { color: var(--navy); background: var(--off-white); }
    .btn-danger-outline {
      background: transparent;
      color: var(--danger);
      border: 2px solid var(--danger);
    }
    .btn-success {
      background: var(--success);
      color: var(--navy);
    }
    .btn-success:hover { opacity: 0.9; }
    .btn-navy {
      background: var(--navy);
      color: var(--white);
    }
    .btn-navy:hover { background: var(--navy-soft); }
    .btn-lg { padding: 1rem 2.2rem; font-size: 1.05rem; border-radius: 12px; }
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }
    .btn-block { width: 100%; justify-content: center; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── DASHBOARD ──────────────────────────────────────────────────── */
    .dashboard {
      max-width: 860px;
      margin: -2.5rem auto 0;
      padding: 0 1.5rem 4rem;
      position: relative;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 600px) { .dashboard-grid { grid-template-columns: 1fr; } }

    .dash-card {
      background: var(--white);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .dash-card:hover {
      border-color: var(--amber);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    .dash-card-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--navy-mid), var(--navy-soft));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .dash-card h3 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: var(--navy);
    }
    .dash-card p { font-size: 0.88rem; color: var(--slate); line-height: 1.5; }
    .dash-card .arrow {
      margin-top: auto;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--amber);
      letter-spacing: 0.02em;
    }

    /* ── SECTION ────────────────────────────────────────────────────── */
    .section { max-width: 860px; margin: 0 auto; padding: 3rem 1.5rem; }
    .section-sm { max-width: 640px; }
    .section-title {
      font-family: var(--font-display);
      font-size: 1.7rem;
      color: var(--navy);
      margin-bottom: 0.4rem;
    }
    .section-sub { color: var(--slate); font-size: 0.92rem; margin-bottom: 2rem; }

    /* ── ISSUE SELECTOR ─────────────────────────────────────────────── */
    .issue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .issue-card {
      background: var(--white);
      border-radius: 12px;
      padding: 1.4rem;
      cursor: pointer;
      border: 2px solid var(--muted);
      transition: all 0.18s ease;
      text-align: center;
    }
    .issue-card:hover, .issue-card.selected {
      border-color: var(--amber);
      background: #fffbf2;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(232,160,32,0.15);
    }
    .issue-card .issue-icon { font-size: 2rem; margin-bottom: 0.5rem; display: block; }
    .issue-card h4 { font-size: 0.92rem; font-weight: 600; color: var(--navy); }

    /* ── QUESTION FLOW ──────────────────────────────────────────────── */
    .question-card {
      background: var(--white);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: var(--shadow);
      max-width: 640px;
      margin: 0 auto;
    }
    .question-progress {
      height: 4px;
      background: var(--muted);
      border-radius: 2px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .question-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--amber), var(--amber-lt));
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .question-label {
      font-size: 0.78rem;
      color: var(--slate);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.7rem;
    }
    .question-text {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--navy);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    .question-hint { font-size: 0.83rem; color: var(--slate); margin-bottom: 1.5rem; }

    .answer-options { display: flex; flex-direction: column; gap: 0.7rem; }
    .answer-option {
      padding: 0.9rem 1.2rem;
      border: 2px solid var(--muted);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-body);
      background: var(--white);
      text-align: left;
    }
    .answer-option:hover {
      border-color: var(--amber);
      background: #fffbf2;
    }
    .answer-option.selected {
      border-color: var(--navy);
      background: var(--navy);
      color: var(--white);
    }

    .form-group { margin-bottom: 1.2rem; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--navy); margin-bottom: 0.4rem; }
    .form-input, .form-textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid var(--muted);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--text-body);
      background: var(--white);
      transition: border-color 0.15s;
      outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--amber); }
    .form-textarea { min-height: 90px; resize: vertical; }

    /* ── RESULTS ────────────────────────────────────────────────────── */
    .results-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
      color: var(--white);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .results-header::after {
      content: '';
      position: absolute;
      right: -20px; top: -20px;
      width: 140px; height: 160px;
      background: var(--amber);
      opacity: 0.06;
      clip-path: polygon(50% 0%, 100% 15%, 100% 65%, 50% 100%, 0% 65%, 0% 15%);
    }
    .results-badge {
      display: inline-block;
      background: rgba(46,204,138,0.2);
      color: var(--success);
      border: 1px solid rgba(46,204,138,0.4);
      border-radius: 999px;
      padding: 0.25rem 0.8rem;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }
    .results-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      margin-bottom: 0.4rem;
    }
    .results-sub { font-size: 0.88rem; color: var(--muted); }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 640px) { .results-grid { grid-template-columns: 1fr; } }

    .result-panel {
      background: var(--white);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }
    .result-panel.full { grid-column: 1 / -1; }
    .panel-title {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--amber);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .rights-summary { font-size: 0.9rem; line-height: 1.7; color: var(--text-body); }
    .rights-summary strong { color: var(--navy); }

    /* ── ACTION PLAN ────────────────────────────────────────────────── */
    .action-list { list-style: none; }
    .action-item {
      display: flex;
      gap: 0.9rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--off-white);
      font-size: 0.88rem;
      align-items: flex-start;
    }
    .action-item:last-child { border-bottom: none; }
    .action-step {
      width: 24px; height: 24px;
      background: var(--navy);
      color: var(--white);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .action-urgent .action-step { background: var(--danger); }
    .action-text { line-height: 1.5; }
    .action-text strong { color: var(--navy); display: block; margin-bottom: 0.1rem; }

    /* ── EVIDENCE CHECKLIST ─────────────────────────────────────────── */
    .checklist { list-style: none; }
    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--off-white);
      font-size: 0.87rem;
    }
    .checklist-item:last-child { border-bottom: none; }
    .checklist-check {
      width: 20px; height: 20px;
      border: 2px solid var(--muted);
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      margin-top: 1px;
    }
    .checklist-check.checked {
      background: var(--success);
      border-color: var(--success);
      color: white;
      font-size: 0.65rem;
    }

    /* ── LETTER PREVIEW ─────────────────────────────────────────────── */
    .letter-preview {
      background: var(--white);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .letter-toolbar {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .letter-toolbar-title {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--amber);
      margin-right: auto;
    }
    .letter-body {
      font-family: Georgia, serif;
      font-size: 0.88rem;
      line-height: 1.8;
      color: var(--text-body);
      white-space: pre-wrap;
      background: var(--off-white);
      border-radius: 8px;
      padding: 1.5rem;
      border-left: 3px solid var(--amber);
      max-height: 400px;
      overflow-y: auto;
    }

    /* ── AI GENERATION ──────────────────────────────────────────────── */
    .ai-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: var(--slate);
      padding: 0.6rem 1rem;
      background: var(--off-white);
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .ai-spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--muted);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── STRIPE PLACEHOLDER ─────────────────────────────────────────── */
    .stripe-section {
      background: linear-gradient(135deg, #1a1040 0%, #2d1b69 100%);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      color: var(--white);
      margin-top: 2rem;
    }
    .stripe-badge {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 0.25rem 0.8rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 0.8rem;
    }
    .stripe-section h3 { font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 0.4rem; }
    .stripe-section p { font-size: 0.85rem; color: rgba(255,255,255,0.65); margin-bottom: 1.5rem; }
    .stripe-features {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .stripe-feature { font-size: 0.8rem; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 0.3rem; }

    /* ── FOOTER ─────────────────────────────────────────────────────── */
    .footer {
      background: var(--navy);
      color: var(--slate-lt);
      text-align: center;
      padding: 2rem 1.5rem;
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .footer strong { color: var(--muted); }

    /* ── TAGS / PILLS ───────────────────────────────────────────────── */
    .tag {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .tag-amber { background: rgba(232,160,32,0.15); color: #a06010; }
    .tag-danger { background: rgba(232,80,80,0.12); color: var(--danger); }
    .tag-success { background: rgba(46,204,138,0.12); color: #1a8a5a; }

    /* ── BREADCRUMB ─────────────────────────────────────────────────── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--slate);
      margin-bottom: 1.5rem;
    }
    .breadcrumb-sep { color: var(--muted); }
    .breadcrumb-link { cursor: pointer; color: var(--amber); font-weight: 500; }
    .breadcrumb-link:hover { text-decoration: underline; }

    /* ── DISCLAIMER BOX ─────────────────────────────────────────────── */
    .disclaimer {
      background: rgba(232,160,32,0.08);
      border: 1px solid rgba(232,160,32,0.3);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      font-size: 0.8rem;
      color: #6b4400;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .disclaimer strong { color: #4a2e00; }

    /* ── HOW IT WORKS (home) ────────────────────────────────────────── */
    .how-section { background: var(--white); padding: 4rem 2rem; }
    .how-inner { max-width: 800px; margin: 0 auto; }
    .how-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--navy);
      text-align: center;
      margin-bottom: 0.3rem;
    }
    .how-sub { text-align: center; color: var(--slate); font-size: 0.9rem; margin-bottom: 2.5rem; }
    .how-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
    }
    .how-step { text-align: center; }
    .how-num {
      width: 44px; height: 44px;
      background: var(--navy);
      color: var(--amber);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 auto 0.8rem;
    }
    .how-step h4 { font-size: 0.95rem; color: var(--navy); margin-bottom: 0.3rem; font-weight: 600; }

//  AI LETTER GENERATION via Anthropic API
//  Personalises letters using the Claude API if user provides details.
// ═══════════════════════════════════════════════════════════════════════

async function generateAILetter(issueId, userData, answers) {
  const issueLabels = { deposit: 'deposit not returned', repairs: 'repairs ignored', harassment: 'landlord harassment', eviction: 'illegal eviction' };
  const prompt = `You are a UK legal letter writing assistant specialising in tenant rights.

Write a formal, professional legal letter for the following tenant situation:

Issue: ${issueLabels[issueId]}
Tenant name: ${userData.yourName || 'the tenant'}
Property address: ${userData.propertyAddress || 'the property'}
Landlord name: ${userData.landlordName || 'the landlord'}
Landlord address: ${userData.landlordAddress || '[Landlord Address]'}
Additional details: ${userData.extraDetails || 'None provided'}
Questionnaire answers: ${JSON.stringify(answers)}

Write the letter in the style of a formal legal letter from a UK solicitor. Include:
- Relevant UK legislation (Housing Act 1988/2004, Protection from Eviction Act 1977, Landlord and Tenant Act 1985, etc.)
- Specific demands with clear deadlines
- Consequences if demands are not met
- Professional closing

Today's date: ${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}

Reply with ONLY the letter text, no preamble or explanation.`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  const data = await response.json();
  if (data.content && data.content[0]) return data.content[0].text;
  throw new Error('No response from AI');
}

//  PDF EXPORT (jsPDF)
// ═══════════════════════════════════════════════════════════════════════

function exportLetterPDF(letterText, issueTitle) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  const pageW = doc.internal.pageSize.getWidth();
  const margin = 22;
  const lineW = pageW - margin * 2;

  // Header bar
  doc.setFillColor(15, 30, 53);
  doc.rect(0, 0, pageW, 18, 'F');
  doc.setTextColor(232, 160, 32);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'bold');
  doc.text('LegalShield AI — UK Tenant Rights', margin, 12);
  doc.setTextColor(160, 180, 200);
  doc.setFontSize(7.5);
  doc.setFont('helvetica', 'normal');
  doc.text('NOT LEGAL ADVICE — For guidance only. Consult a qualified solicitor for your specific situation.', pageW - margin, 12, { align: 'right' });

  // Title
  doc.setTextColor(15, 30, 53);
  doc.setFontSize(13);
  doc.setFont('helvetica', 'bold');
  doc.text(issueTitle, margin, 32);
  doc.setDrawColor(232, 160, 32);
  doc.setLineWidth(0.8);
  doc.line(margin, 35, margin + 60, 35);

  // Letter body
  doc.setFont('times', 'normal');
  doc.setFontSize(10.5);
  doc.setTextColor(44, 62, 88);

  const lines = doc.splitTextToSize(letterText, lineW);
  let y = 44;
  const pageH = doc.internal.pageSize.getHeight();

  lines.forEach(line => {
    if (y > pageH - 25) {
      doc.addPage();
      // Small header on new pages
      doc.setFillColor(15, 30, 53);
      doc.rect(0, 0, pageW, 10, 'F');
      y = 20;
      doc.setFont('times', 'normal');
      doc.setFontSize(10.5);
      doc.setTextColor(44, 62, 88);
    }
    doc.text(line, margin, y);
    y += 5.5;
  });

  // Footer
  const fY = pageH - 12;
  doc.setDrawColor(200, 210, 220);
  doc.setLineWidth(0.3);
  doc.line(margin, fY - 4, pageW - margin, fY - 4);
  doc.setFontSize(7.5);
  doc.setTextColor(120, 140, 160);
  doc.setFont('helvetica', 'normal');
  doc.text(`Generated ${new Date().toLocaleDateString('en-GB')} by LegalShield AI`, margin, fY);
  doc.text('legalshield.ai', pageW - margin, fY, { align: 'right' });

  doc.save(`LegalShield_Letter_${issueTitle.replace(/\s+/g, '_')}.pdf`);
}

//  STRIPE CHECKOUT (live)
//  Calls the Netlify Function at netlify/functions/create-checkout.js,
//  which creates a Stripe Checkout Session server-side and returns its
//  URL. The Stripe secret key never touches the browser.
// ═══════════════════════════════════════════════════════════════════════

async function handleStripeCheckout(planName) {
  try {
    const response = await fetch('/.netlify/functions/create-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan: planName }),
    });

    if (!response.ok) {
      throw new Error('Checkout session request failed');
    }

    const { url } = await response.json();

    if (url) {
      window.location.href = url; // redirect to Stripe Checkout
    } else {
      throw new Error('No checkout URL returned');
    }
  } catch (err) {
    console.error('Stripe checkout error:', err);
    alert('Sorry, something went wrong starting checkout. Please try again.');
  }
}

// ── QUESTION FLOW ──────────────────────────────────────────────────────
function QuestionFlow({ issueId, mode, onComplete, onBack }) {
  const questions = DECISION_TREES[issueId];
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [selected, setSelected] = useState(null);

  const current = questions[step];
  const progress = ((step + 1) / (questions.length + 1)) * 100;

  function handleAnswer(answer) {
    setSelected(answer);
  }

  function handleNext() {
    const newAnswers = { ...answers, [current.id]: selected };
    setAnswers(newAnswers);
    setSelected(null);
    if (step < questions.length - 1) {
      setStep(step + 1);
    } else {
      onComplete(newAnswers);
    }
  }

  return (
    <div className="section section-sm" style={{ margin: '0 auto', paddingTop: '2.5rem' }}>
      <div className="breadcrumb">
        <span className="breadcrumb-link" onClick={onBack}>← Back</span>
        <span className="breadcrumb-sep">›</span>
        <span>{LEGAL_DATA[issueId].title}</span>
      </div>
      <div className="question-card">
        <div className="question-progress">
          <div className="question-progress-bar" style={{ width: `${progress}%` }} />
        </div>
        <p className="question-label">Question {step + 1} of {questions.length}</p>
        <h3 className="question-text">{current.question}</h3>
        {current.hint && <p className="question-hint">{current.hint}</p>}
        <div className="answer-options">
          {current.answers.map(ans => (
            <button
              key={ans}
              className={`answer-option${selected === ans ? ' selected' : ''}`}
              onClick={() => handleAnswer(ans)}
            >
              {ans}
            </button>
          ))}
        </div>
        <div style={{ marginTop: '1.5rem', display: 'flex', gap: '0.8rem', justifyContent: 'flex-end' }}>
          {step > 0 && <button className="btn btn-ghost" onClick={() => setStep(s => s - 1)}>Back</button>}
          <button className="btn btn-primary" disabled={!selected} onClick={handleNext}>
            {step < questions.length - 1 ? 'Next →' : mode === 'rights' ? 'See My Rights →' : 'Continue to Letter →'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
//  MAIN APP — ROUTING STATE MACHINE
// ═══════════════════════════════════════════════════════════════════════

function App() {
  // screen: home | select | questions | details | results
  const [screen, setScreen] = useState('home');
  const [mode, setMode] = useState(null);       // 'rights' | 'letter'
  const [issueId, setIssueId] = useState(null);
  const [answers, setAnswers] = useState({});
  const [userData, setUserData] = useState(null);

  function goHome() {
    setScreen('home'); setMode(null); setIssueId(null);
    setAnswers({}); setUserData(null);
  }

  function startFlow(m) {
    setMode(m); setScreen('select');
  }

  function handleIssueSelect(id, overrideScreen) {
    if (overrideScreen === 'home') { goHome(); return; }
    setIssueId(id);
    setScreen('questions');
  }

  function handleAnswersComplete(ans) {
    setAnswers(ans);
    if (mode === 'letter') {
      setScreen('details');
    } else {
      // Rights check — show results with empty userData
      setUserData({});
      setScreen('results');
    }
  }

  function handleDetailsComplete(data) {
    setUserData(data);
    setScreen('results');
  }

  return (
    <div className="app-shell">
      <Nav onHome={goHome} />
      <main className="main-content">
        {screen === 'home' && <HomePage onStart={startFlow} />}
        {screen === 'select' && (
          <IssueSelector
            mode={mode}
            onSelect={handleIssueSelect}
          />
        )}
        {screen === 'questions' && issueId && (
          <QuestionFlow
            issueId={issueId}
            mode={mode}
            onComplete={handleAnswersComplete}
            onBack={() => setScreen('select')}
          />
        )}
        {screen === 'details' && issueId && (
          <DetailsForm
            issueId={issueId}
            answers={answers}
            onComplete={handleDetailsComplete}
            onBack={() => setScreen('questions')}
          />
        )}
        {screen === 'results' && issueId && (
          <ResultsPage
            issueId={issueId}
            answers={answers}
            userData={userData}
            mode={mode}
            onBack={() => setScreen(mode === 'letter' ? 'details' : 'questions')}
            onNewIssue={goHome}
          />
        )}
      </main>
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
