  deposit: {
    title: 'Deposit Not Returned',
    rights: `Under the <strong>Housing Act 2004</strong>, landlords must protect your deposit in a government-approved tenancy deposit scheme (TDS, DPS, or MyDeposits) within <strong>30 days</strong> of receiving it, and provide you with the prescribed information.\n\nIf your deposit was not protected, your landlord may owe you between <strong>1× and 3× the deposit amount</strong> as a penalty, which you can claim through the county court.\n\nWhen your tenancy ends, your landlord must return your deposit within <strong>10 days</strong> of you both agreeing the amount. If there is a dispute, the scheme's free <strong>Alternative Dispute Resolution (ADR)</strong> service can adjudicate.\n\nDeductions are only permitted for <strong>damages beyond fair wear and tear, unpaid rent, or breach of tenancy agreement</strong>. Betterment (e.g. replacing a worn carpet entirely at your cost) is not permitted.`,
    urgency: 'medium',
    actions: [
      { title: 'Request deposit return in writing', detail: 'Email your landlord formally requesting return within 10 days. Keep all written communication.', urgent: false },
      { title: 'Check scheme registration', detail: 'Visit TDS, DPS, and MyDeposits websites to check whether your deposit was registered. You can do this with your postcode and landlord name.', urgent: false },
      { title: 'File an ADR dispute', detail: 'If your deposit is protected and the landlord disputes deductions, use the scheme\'s free ADR service. File within 3 months of your tenancy ending.', urgent: false },
      { title: 'Issue a county court claim', detail: 'If the deposit was not protected or the landlord refuses to engage, file a small claims court application (N1 form) at gov.uk/make-court-claim-for-money. Claims up to £10,000 are handled in the small claims track.', urgent: false },
      { title: 'Seek council help if at risk of homelessness', detail: 'If you cannot afford a new property without the deposit, contact your local council\'s housing team immediately.', urgent: false },
    ],
    evidence: [
      'Tenancy agreement (signed copy)',
      'Bank statement showing deposit payment',
      'Any scheme protection certificate received',
      'Inventory / check-in report',
      'Check-out report or photos of property condition',
      'All written communication with landlord',
      'Photographs of property at end of tenancy',
      'Receipts for any cleaning or repairs done by you',
    ],
    letterType: 'deposit_demand',
  },
  repairs: {
    title: 'Repairs Ignored',
    rights: `Under <strong>Section 11 of the Landlord and Tenant Act 1985</strong>, your landlord has a legal duty to keep the structure, exterior, and essential services (heating, hot water, plumbing, sanitation) of your property in good repair.\n\nThe <strong>Homes (Fitness for Human Habitation) Act 2018</strong> also requires your home to be fit to live in throughout the tenancy, covering serious issues such as damp, mould, cold, and structural instability.\n\nYour landlord must carry out repairs <strong>within a reasonable time</strong> after being notified. For emergencies (no heating in winter, dangerous electrics), this may be 24–48 hours. For non-urgent repairs, 28 days is generally considered reasonable.\n\nYou may be able to use the council's <strong>Environmental Health department</strong> to issue a legal improvement notice if your landlord fails to act, which carries fines and legal obligations.`,
    urgency: 'medium',
    actions: [
      { title: 'Send formal repair notice', detail: 'Write a letter/email to your landlord specifying the repair needed, the date you first reported it, and a 14-day deadline to respond. This creates a legal paper trail.', urgent: false },
      { title: 'Contact Environmental Health', detail: 'If the landlord does not respond within 14 days, report to your local council\'s Environmental Health team. They can inspect and issue a Hazard Awareness Notice or Improvement Notice.', urgent: false },
      { title: 'Document everything', detail: 'Photograph and video the issue. Keep a log of every contact with your landlord about the repair.', urgent: false },
      { title: 'Consider rent withholding (with caution)', detail: 'You cannot simply withhold rent — this will put you in arrears. However, you may be able to apply to court to pay rent into a "repair fund" account. Seek legal advice first.', urgent: false },
      { title: 'Claim compensation', detail: 'If the disrepair has affected your health or caused damage to your possessions, you may be able to claim damages through the county court or a disrepair specialist solicitor (many work on no-win no-fee).', urgent: false },
    ],
    evidence: [
      'Tenancy agreement (to establish landlord\'s repairing obligations)',
      'Written notice of repair sent to landlord (email/letter)',
      'Photographs and videos of the issue with timestamps',
      'Any landlord responses (or lack thereof)',
      'Medical records if health has been affected',
      'Reports from tradespeople (independent quote)',
      'Council inspection reports (if applicable)',
      'Diary log with dates and descriptions of the problem',
    ],
    letterType: 'repair_demand',
  },
  harassment: {
    title: 'Landlord Harassment',
    rights: `Under the <strong>Protection from Eviction Act 1977</strong>, it is a criminal offence for a landlord to harass a tenant with the intention of making them leave the property. This includes:\n\n• Entering the property without 24 hours' written notice (except in genuine emergencies)\n• Threats, intimidation, or abusive behaviour\n• Interfering with your peace or comfort\n• Cutting off utilities such as gas, electricity, or water\n\nYour landlord does <strong>not</strong> have the right to enter the property whenever they wish — this is your home, and you have the right to quiet enjoyment under <strong>Section 1(3) of the Landlord and Tenant Act 1985</strong>.\n\nHarassment and illegal eviction are <strong>criminal offences</strong> — your landlord could face an unlimited fine and/or imprisonment. You can also claim civil damages.`,
    urgency: 'high',
    actions: [
      { title: 'Contact the police immediately if you feel unsafe', detail: 'Harassment and threats may constitute criminal offences. Call 999 in emergencies or 101 for non-emergency reports. Always get a crime reference number.', urgent: true },
      { title: 'Report to your local council', detail: 'Council\'s tenancy relations officer or private sector housing team can investigate and take action against landlords who harass tenants. This is free.', urgent: true },
      { title: 'Seek an emergency injunction', detail: 'If the harassment is severe, you can apply to a county court for an emergency injunction to stop the landlord\'s behaviour. Seek a solicitor or contact Shelter immediately.', urgent: true },
      { title: 'Document all incidents', detail: 'Keep a detailed log with dates, times, and descriptions. Save text messages, voicemails, and emails. Ask witnesses to provide statements.', urgent: false },
      { title: 'Contact Shelter or CAB', detail: 'Shelter (0808 800 4444) and Citizens Advice offer free, expert guidance on tenant harassment. They can also help you find local legal support.', urgent: false },
    ],
    evidence: [
      'Log of all incidents (dates, times, what happened)',
      'Text messages, emails, and voicemails from landlord',
      'Photographs of forced entry, damaged locks, removed belongings',
      'Witness statements from neighbours or others',
      'Police crime reference number(s)',
      'Your tenancy agreement (right to quiet enjoyment)',
      'Screenshots of social media messages if applicable',
      'Any medical or counselling records (if stress-related)',
    ],
    letterType: 'harassment_warning',
  },
  eviction: {
    title: 'Illegal Eviction',
    rights: `Under the <strong>Protection from Eviction Act 1977</strong>, it is a criminal offence to evict a residential occupier without a court order, regardless of the reason. Your landlord cannot legally remove you by:\n\n• Changing the locks\n• Removing your belongings\n• Cutting off your utilities\n• Physical force or threats\n\nEven with a valid <strong>Section 21</strong> or <strong>Section 8</strong> notice, your landlord <strong>must obtain a court possession order</strong> and enforce it through an authorised court officer (bailiff). You do not have to leave until a court orders it.\n\nNote: Section 21 "no fault" eviction notices require at least <strong>2 months' notice</strong> and cannot be served in the first 4 months of a tenancy. Several procedural requirements must be met or the notice is invalid.`,
    urgency: 'critical',
    actions: [
      { title: 'Do not leave the property', detail: 'If you have been illegally locked out, you have the right to re-enter your home. Do not abandon the property as this may affect your legal position.', urgent: true },
      { title: 'Call the police immediately', detail: 'Illegal eviction is a criminal offence. Contact police (999 or 101) and explain you have been illegally evicted. They can attend and require the landlord to let you back in.', urgent: true },
      { title: 'Contact your council emergency housing team', detail: 'Council tenancy relations officers can act urgently in cases of illegal eviction, including out-of-hours emergency lines in many areas.', urgent: true },
      { title: 'Apply for emergency injunction', detail: 'You can apply to a county court on an emergency basis (even without a solicitor using Form N16A) to be reinstated to the property.', urgent: true },
      { title: 'Check the validity of any Section 21 notice', detail: 'Many Section 21 notices are invalid. Check: Was your deposit protected? Were you given a Gas Safety Certificate and EPC? Is the notice properly dated and signed? Seek advice from Shelter.', urgent: false },
    ],
    evidence: [
      'Your tenancy agreement',
      'Any eviction notice received (keep the original)',
      'Photographs of changed locks or removed belongings',
      'Evidence you were living at the property (mail, bank statements)',
      'Witness accounts of the eviction',
      'Police crime reference number',
      'Copies of any documents served (or not served) by landlord',
      'Communication from landlord regarding eviction',
    ],
    letterType: 'eviction_warning',
  },

  // ── EMPLOYMENT ───────────────────────────────────────────────────────
  unfair_dismissal: {
    title: 'Unfair Dismissal',
    rights: `Under the <strong>Employment Rights Act 1996</strong>, employees with 2 or more years of continuous employment have the right not to be unfairly dismissed.\n\nYour employer must have a <strong>fair reason</strong> for dismissal (capability, conduct, redundancy, statutory illegality, or some other substantial reason) and must follow a <strong>fair procedure</strong> — including written warnings, a formal meeting, and the right of appeal.\n\nIf your employer failed to follow the <strong>ACAS Code of Practice on Disciplinary and Grievance Procedures</strong>, any tribunal award can be increased by up to <strong>25%</strong>.\n\nYou must contact <strong>ACAS for Early Conciliation</strong> before submitting an Employment Tribunal claim. Claims must be made within <strong>3 months minus 1 day</strong> from the date of dismissal. This deadline is strict.`,
    urgency: 'high',
    actions: [
      { title: 'Note the 3-month deadline immediately', detail: 'You have 3 months minus 1 day from your dismissal date to start the ACAS Early Conciliation process. Missing this deadline means you lose your right to claim.', urgent: true },
      { title: 'Contact ACAS for Early Conciliation', detail: 'Visit acas.org.uk or call 0300 123 1100. Early Conciliation is free, confidential, and mandatory before you can bring a tribunal claim. ACAS will attempt to negotiate a settlement.', urgent: true },
      { title: 'Submit a formal grievance appeal', detail: 'Write to your employer appealing the dismissal decision within any timescale stated in your contract. This shows you followed proper procedure and strengthens your tribunal case.', urgent: false },
      { title: 'Gather your employment documents', detail: 'Collect your contract, payslips, any disciplinary letters, meeting notes, and correspondence. Subject access requests (GDPR) can retrieve employer records.', urgent: false },
      { title: 'Consider an Employment Tribunal claim', detail: 'If ACAS conciliation fails, you can submit an ET1 form at employmenttribunals.service.gov.uk. Claims are free to submit. You may be able to claim up to 1 year\'s salary (capped at £93,878 for 2024/25).', urgent: false },
    ],
    evidence: [
      'Employment contract and any amendments',
      'Dismissal letter or written notice',
      'Any disciplinary letters or warnings received',
      'Notes or recordings of disciplinary meetings',
      'Payslips (last 3 months minimum)',
      'Any HR correspondence',
      'ACAS Early Conciliation certificate',
      'Witness statements from colleagues if applicable',
    ],
    letterType: 'unfair_dismissal_grievance',
  },

  unpaid_wages: {
    title: 'Unpaid Wages',
    rights: `Under the <strong>Employment Rights Act 1996</strong>, your employer must pay you all wages owed on the agreed pay date. Unauthorised deductions from wages are unlawful.\n\nThis includes <strong>regular salary, holiday pay, notice pay, commission, and bonuses</strong> that are contractually due.\n\nFor holiday pay, the <strong>Working Time Regulations 1998</strong> entitle all workers (not just employees) to at least 5.6 weeks paid holiday per year.\n\nYou can bring an <strong>unlawful deduction of wages claim</strong> to an Employment Tribunal within 3 months minus 1 day of the deduction. For larger amounts, you can also use the <strong>county court</strong> (small claims for under £10,000), which has a 6-year limitation period.\n\nIf your employer is insolvent, you may be able to claim unpaid wages from the <strong>Insolvency Service</strong>.`,
    urgency: 'medium',
    actions: [
      { title: 'Write a formal demand for payment', detail: 'Email or write to your employer (or HR) specifying exactly what is owed, the pay period it relates to, and a deadline of 7 days to pay. Keep all written evidence.', urgent: false },
      { title: 'Submit a grievance', detail: 'If your employer does not respond, submit a formal written grievance under your employer\'s grievance procedure. This creates a paper trail and is important if you later go to tribunal.', urgent: false },
      { title: 'Contact ACAS for Early Conciliation', detail: 'Before bringing an Employment Tribunal claim, you must notify ACAS. Visit acas.org.uk. The 3-month minus 1 day deadline applies from the date of the unlawful deduction.', urgent: false },
      { title: 'Consider small claims court for larger amounts', detail: 'For debts up to £10,000, the county court small claims track is an alternative with a 6-year limitation period — useful if the 3-month tribunal deadline has passed.', urgent: false },
      { title: 'Report to HMRC if National Minimum Wage is not being paid', detail: 'If your employer is paying below the National Minimum Wage, report to HMRC at gov.uk/report-employer-minimum-wage. HMRC can investigate and enforce payment.', urgent: false },
    ],
    evidence: [
      'Employment contract (confirming pay rate and pay dates)',
      'Payslips for the relevant period',
      'Bank statements showing what was actually paid',
      'Any written communication about the pay dispute',
      'Timesheets or records of hours worked',
      'Holiday entitlement records',
      'Email or letter demanding payment',
      'Employer\'s response (or lack thereof)',
    ],
    letterType: 'unpaid_wages_demand',
  },

  discrimination: {
    title: 'Workplace Discrimination',
    rights: `Under the <strong>Equality Act 2010</strong>, it is unlawful to discriminate against someone at work because of a <strong>protected characteristic</strong>. These are: age, disability, gender reassignment, marriage and civil partnership, pregnancy and maternity, race, religion or belief, sex, and sexual orientation.\n\nForms of prohibited conduct include:\n• <strong>Direct discrimination</strong> — treating someone less favourably because of a protected characteristic\n• <strong>Indirect discrimination</strong> — a policy that disadvantages a group sharing a protected characteristic\n• <strong>Harassment</strong> — unwanted conduct related to a protected characteristic that violates dignity\n• <strong>Victimisation</strong> — treating someone badly because they made or supported a discrimination complaint\n\nClaims must be brought to the <strong>Employment Tribunal within 3 months minus 1 day</strong> of the discriminatory act. There is no cap on discrimination awards.`,
    urgency: 'high',
    actions: [
      { title: 'Document every incident immediately', detail: 'Write down what happened, when, where, who was present, and any witnesses. Save any emails, messages, or documents. Contemporaneous notes are powerful evidence.', urgent: true },
      { title: 'Submit a formal grievance to your employer', detail: 'Write a formal grievance letter to HR or your line manager\'s manager specifying the discriminatory acts, the protected characteristic involved, and what you want to happen. Your employer must investigate.', urgent: false },
      { title: 'Contact ACAS for Early Conciliation', detail: 'Before bringing a tribunal claim you must notify ACAS. Do this before the 3-month deadline from the most recent discriminatory act. Call 0300 123 1100 or visit acas.org.uk.', urgent: false },
      { title: 'Consider an Employment Tribunal claim', detail: 'Discrimination claims have no financial cap on compensation. Awards can include injury to feelings (Vento scale: £1,100–£44,000+), lost earnings, and aggravated damages.', urgent: false },
      { title: 'Contact the Equality Advisory Support Service', detail: 'EASS (0808 800 0082) provides free advice on discrimination law and can help you understand your options before you decide to take formal action.', urgent: false },
    ],
    evidence: [
      'Written log of every discriminatory incident (date, time, what was said/done)',
      'Emails, messages, or notes containing discriminatory content',
      'Witness names and contact details',
      'Your formal grievance letter and employer\'s response',
      'HR policies on equality and diversity',
      'Comparator examples (how others without your characteristic were treated)',
      'Medical evidence if disability discrimination is involved',
      'ACAS Early Conciliation certificate',
    ],
    letterType: 'discrimination_grievance',
  },

  // ── CONSUMER ─────────────────────────────────────────────────────────
  faulty_goods: {
    title: 'Faulty Goods / Refund Refused',
    rights: `Under the <strong>Consumer Rights Act 2015</strong>, goods must be of satisfactory quality, fit for purpose, and as described. Services must be carried out with reasonable care and skill.\n\n<strong>Within 30 days</strong> of purchase: you have an automatic right to a full refund — this is the "short-term right to reject."\n\n<strong>30 days to 6 months</strong>: the seller must repair or replace the goods. If this fails, you are entitled to a refund (which may be reduced for use).\n\n<strong>6 months to 6 years</strong>: you can still claim but must prove the fault existed at the time of sale.\n\nFor <strong>credit card purchases over £100</strong>, Section 75 of the Consumer Credit Act 1974 makes your credit card company jointly liable — you can claim against them directly.\n\nFor <strong>debit card purchases</strong>, chargeback through your bank may be available.`,
    urgency: 'medium',
    actions: [
      { title: 'Contact the seller in writing', detail: 'Email or write to the seller specifying the fault, when you purchased the item, and whether you want a refund, repair, or replacement. Keep proof of delivery.', urgent: false },
      { title: 'Exercise your short-term right to reject (within 30 days)', detail: 'If within 30 days, you are entitled to a full refund. State this clearly in your letter citing the Consumer Rights Act 2015, Section 20.', urgent: false },
      { title: 'Try Section 75 or chargeback', detail: 'For credit card purchases over £100, contact your card provider and request a Section 75 claim. For debit cards, request a chargeback within 120 days of the transaction.', urgent: false },
      { title: 'Use Alternative Dispute Resolution', detail: 'Many retailers are members of an ADR scheme. Check the retailer\'s website for their ADR provider — this is free and can resolve disputes without court.', urgent: false },
      { title: 'Small claims court', detail: 'For amounts up to £10,000, file a claim at gov.uk/make-court-claim-for-money. The fee is proportional to the claim amount and is recoverable if you win.', urgent: false },
    ],
    evidence: [
      'Proof of purchase (receipt, order confirmation, bank statement)',
      'Photographs or video of the fault',
      'Product description from website or packaging (if "not as described")',
      'Written communication with the seller',
      'Any repair or replacement attempts and their outcome',
      'Independent assessment or quote if relevant',
      'Credit card or bank statement showing payment method',
    ],
    letterType: 'faulty_goods_demand',
  },

  scam: {
    title: 'Scam or Fraud',
    rights: `If you have been the victim of a scam or fraud, you have several potential routes to recover your money depending on how you paid:\n\n<strong>Bank transfer (Authorised Push Payment fraud)</strong>: Under the <strong>PSR APP Fraud Reimbursement Scheme</strong> (mandatory from October 2024), banks must reimburse victims of authorised push payment fraud up to £85,000 in most cases, unless the victim was grossly negligent.\n\n<strong>Credit card</strong>: Section 75 of the Consumer Credit Act 1974 gives you a claim against your credit card provider for purchases between £100 and £30,000.\n\n<strong>Debit card</strong>: Chargeback may be available within 120 days.\n\nReport all fraud to <strong>Action Fraud (0300 123 2040 or actionfraud.police.uk)</strong> — you will receive a crime reference number which is essential for bank claims.\n\nThe <strong>Financial Ombudsman Service</strong> can adjudicate if your bank refuses to reimburse you.`,
    urgency: 'high',
    actions: [
      { title: 'Contact your bank immediately', detail: 'Call your bank\'s fraud line (usually on the back of your card) as soon as possible. The sooner you report, the better the chance of stopping or recovering the payment.', urgent: true },
      { title: 'Report to Action Fraud', detail: 'Report online at actionfraud.police.uk or call 0300 123 2040. Keep your crime reference number — your bank will require it for any reimbursement claim.', urgent: true },
      { title: 'Request reimbursement from your bank in writing', detail: 'Submit a formal written complaint to your bank citing the PSR APP Fraud Reimbursement Scheme (for bank transfers) or Section 75 (for credit cards). Include your crime reference number.', urgent: false },
      { title: 'Complain to the Financial Ombudsman if the bank refuses', detail: 'If your bank rejects your claim or does not respond within 8 weeks, escalate to the Financial Ombudsman Service (financial-ombudsman.org.uk). This is free.', urgent: false },
      { title: 'Report to Trading Standards if a trader was involved', detail: 'Report rogue traders to Citizens Advice Consumer Helpline (0808 223 1133) who will pass it to Trading Standards for investigation.', urgent: false },
    ],
    evidence: [
      'Bank statements showing the fraudulent transaction(s)',
      'Any communications from the scammer (emails, texts, social media)',
      'Screenshots of any fake websites or adverts',
      'Action Fraud crime reference number',
      'Your formal complaint letter to the bank',
      'Bank\'s response (or lack of response)',
      'Any receipts, invoices, or order confirmations from the scammer',
    ],
    letterType: 'scam_bank_complaint',
  },

  // ── DEBT ─────────────────────────────────────────────────────────────
  debt_harassment: {
    title: 'Debt Collector Harassment',
    rights: `Debt collectors must follow strict rules set out in the <strong>Financial Conduct Authority (FCA) Consumer Credit Sourcebook (CONC)</strong> and the <strong>FCA Principles for Businesses</strong>.\n\nDebt collectors cannot:\n• Contact you at unreasonable hours (generally before 8am or after 9pm)\n• Contact you excessively or in a way designed to intimidate\n• Use threatening, false, or misleading language\n• Contact your employer or family without your consent\n• Claim to be a court official or use official-looking documents to intimidate\n• Add charges that are not permitted under your original agreement\n\nIf the debt is over <strong>6 years old</strong> (5 in Scotland) and you have not made payment or acknowledged it in writing, it may be <strong>statute-barred</strong> and unenforceable in court under the <strong>Limitation Act 1980</strong>.\n\nYou can request the debt collector <strong>cease contact</strong> — they must only contact you to confirm they are taking legal action.`,
    urgency: 'medium',
    actions: [
      { title: 'Send a cease contact letter', detail: 'Write to the debt collector instructing them to communicate only in writing and to cease phone calls. They must comply or only contact you to confirm legal action. Send by recorded post.', urgent: false },
      { title: 'Request a copy of the original credit agreement', detail: 'Under Section 78 of the Consumer Credit Act 1974, you can request a copy of your original credit agreement for £1. If they cannot provide it, they cannot enforce the debt while it is outstanding.', urgent: false },
      { title: 'Check whether the debt is statute-barred', detail: 'If no payment or written acknowledgment has been made for 6 years (England/Wales), the debt may be unenforceable. Seek advice from StepChange (0800 138 1111) or National Debtline (0808 808 4000).', urgent: false },
      { title: 'Complain to the FCA and Financial Ombudsman', detail: 'If the collector is breaking FCA rules, complain directly to the firm. If unsatisfied, escalate to the Financial Ombudsman Service (financial-ombudsman.org.uk).', urgent: false },
      { title: 'Get free debt advice', detail: 'StepChange (stepchange.org), National Debtline (0808 808 4000), and Citizens Advice all provide free, confidential debt advice including options like Debt Relief Orders and IVAs.', urgent: false },
    ],
    evidence: [
      'Log of all contact attempts (dates, times, what was said)',
      'Recordings or transcripts of phone calls if available',
      'Any written communications from the debt collector',
      'Original credit agreement if you have it',
      'Proof of any payments made (bank statements)',
      'Your cease contact letter and proof of postage',
      'Any misleading or threatening correspondence',
    ],
    letterType: 'debt_cease_contact',
  },

  bailiffs: {
    title: 'Bailiff Action',
    rights: `Bailiffs (also called enforcement agents) must follow strict rules under the <strong>Taking Control of Goods Regulations 2013</strong>.\n\nKey rights:\n• Bailiffs must give you at least <strong>7 clear days written notice</strong> (a Notice of Enforcement) before their first visit\n• They can only visit between <strong>6am and 9pm</strong>\n• They <strong>cannot force entry</strong> to your home for most debts (council tax, CCJs) — they can only enter peacefully through an unlocked door\n• They cannot take <strong>essential items</strong> such as clothing, bedding, a cooker, fridge, or tools needed for work up to £1,350\n• They cannot take goods belonging to someone else or goods on hire purchase\n• <strong>Vulnerable people</strong> (disabled, seriously ill, elderly, children under 18 at home, recently bereaved) have additional protections\n\nIf a bailiff breaks these rules, their action may be unlawful and you may be able to apply to court to have it set aside.`,
    urgency: 'high',
    actions: [
      { title: 'Do not let the bailiff in if you are unsure of their authority', detail: 'Ask for their name, the company they work for, and the enforcement authority order. Check their credentials. You do not have to open the door.', urgent: true },
      { title: 'Contact the bailiff company in writing immediately', detail: 'If you are vulnerable, dispute the debt, or the bailiff has acted unlawfully, write to the company immediately with evidence. This can pause action.', urgent: true },
      { title: 'Contact the original creditor', detail: 'Sometimes paying the creditor directly (before goods are taken) can halt bailiff action. Ask if a payment plan can be arranged.', urgent: false },
      { title: 'Apply to court to set aside the judgment', detail: 'If you were unaware of the original court judgment (e.g. it was sent to an old address), you may be able to apply to have it set aside using Form N244 at your local county court.', urgent: false },
      { title: 'Get free specialist debt advice', detail: 'Contact National Debtline (0808 808 4000) or StepChange (0800 138 1111) urgently. They can advise on whether bailiff action can be challenged and what alternatives exist.', urgent: false },
    ],
    evidence: [
      'Notice of Enforcement letter (if received)',
      'Any correspondence from the bailiff company',
      'Original court order or CCJ documentation',
      'Evidence of vulnerability (medical letters, benefit award letters)',
      'Log of bailiff visits (dates, times, what happened)',
      'Evidence of any goods removed',
      'Photographs of any damage caused during entry',
      'Proof of payments already made',
    ],
    letterType: 'bailiff_complaint',
  },

  // ── NEIGHBOUR ────────────────────────────────────────────────────────
  noise: {
    title: 'Noise Nuisance',
    rights: `Excessive noise from neighbours can constitute a <strong>statutory nuisance</strong> under the <strong>Environmental Protection Act 1990</strong>. Your local council's Environmental Health team has powers to investigate and serve an <strong>Abatement Notice</strong> on the person causing the noise.\n\nBreaching an Abatement Notice is a criminal offence carrying a fine of up to <strong>£5,000</strong> for domestic premises.\n\nUnder the <strong>Noise Act 1996</strong>, councils have additional powers to deal with excessive noise from dwellings at night (11pm–7am).\n\nIf you are a tenant, your landlord may also have obligations to deal with noise caused by other tenants in the same building. Persistent noise nuisance can entitle a tenant to a rent reduction.\n\nAs a last resort, you can bring a <strong>private nuisance claim</strong> in the county court for damages and an injunction, but this is expensive and should follow all other avenues.`,
    urgency: 'medium',
    actions: [
      { title: 'Keep a detailed noise diary', detail: 'Record every incident — date, time, duration, type of noise, and how it affected you. This is essential evidence for council action or court proceedings.', urgent: false },
      { title: 'Speak to your neighbour (if safe to do so)', detail: 'A polite conversation or note often resolves noise issues without escalation. Your neighbour may not realise the impact.', urgent: false },
      { title: 'Report to Environmental Health', detail: 'Contact your local council\'s Environmental Health team. They can investigate, install noise monitoring equipment, and serve an Abatement Notice. This is free.', urgent: false },
      { title: 'Try mediation', detail: 'Community mediation services (often free through your council) can resolve neighbour disputes without legal action. Many councils offer this as a first step.', urgent: false },
      { title: 'Apply for an injunction as a last resort', detail: 'If all else fails, you can apply to the county court for an injunction to stop the noise. Seek legal advice first — this involves costs.', urgent: false },
    ],
    evidence: [
      'Noise diary (dates, times, duration, type, impact on you)',
      'Audio or video recordings of the noise',
      'Witness statements from other neighbours affected',
      'Any previous communication with the neighbour about the issue',
      'Council noise monitoring reports if applicable',
      'Medical evidence if health has been affected (e.g. sleep deprivation)',
      'Correspondence with your landlord if relevant',
    ],
    letterType: 'noise_complaint',
  },

  boundary: {
    title: 'Boundary Dispute',
    rights: `Boundary disputes are governed by general property law and the documents registered with <strong>HM Land Registry</strong>. The definitive boundary is determined by your <strong>title deeds</strong> and the Land Registry title plan, though these often show only general boundaries.\n\nKey principles:\n• The <strong>Land Registration Act 2002</strong> governs registered land — you can apply to HM Land Registry to determine a boundary precisely\n• <strong>Adverse possession</strong> (squatter's rights) may apply if someone has occupied land for 10+ years (registered land) or 12+ years (unregistered land) — this cuts both ways\n• Overhanging branches can be cut back to the boundary (but must be offered back to the neighbour)\n• Roots causing damage may give rise to a <strong>nuisance claim</strong>\n• Always check your deeds, any conveyance plans, and local Land Registry documents before taking action`,
    urgency: 'low',
    actions: [
      { title: 'Get copies of your title deeds', detail: 'Download your title register and title plan from HM Land Registry (landregistry.gov.uk) for £3 each. Also request your neighbour\'s title plan to compare boundaries.', urgent: false },
      { title: 'Write to your neighbour formally', detail: 'If informal discussion has failed, write a formal letter setting out your position with reference to the title deeds. Keep it factual and professional.', urgent: false },
      { title: 'Instruct a boundary surveyor', detail: 'A chartered boundary surveyor can produce an expert report on where the legal boundary lies. This is useful evidence for any legal proceedings.', urgent: false },
      { title: 'Try mediation', detail: 'The Royal Institution of Chartered Surveyors (RICS) and local mediation services can help resolve boundary disputes without court action, which is far cheaper.', urgent: false },
      { title: 'Apply to HM Land Registry for a determined boundary', detail: 'Under the Land Registration Act 2002, you can apply to fix the exact boundary on the register. This is not a quick process but provides a definitive answer.', urgent: false },
    ],
    evidence: [
      'Your title register and title plan from Land Registry',
      'Original conveyance or transfer deeds if available',
      'Historic photographs showing the boundary position',
      'Any planning permissions for fences or structures',
      'Correspondence with your neighbour about the dispute',
      'Surveyor\'s report if obtained',
      'Witness statements from long-standing neighbours',
      'Photographs showing current boundary position',
    ],
    letterType: 'boundary_dispute',
  },

  // ── SMALL CLAIMS ─────────────────────────────────────────────────────
  small_claims: {
    title: 'Small Claims Court',
    rights: `The <strong>small claims track</strong> in the county court handles most civil disputes up to <strong>£10,000</strong> in England and Wales (£5,000 in Scotland's Simple Procedure). It is designed to be used without a solicitor.\n\nKey features:\n• Court fees are proportional to your claim amount (from £35 for claims under £300)\n• Legal costs are generally not recoverable in small claims, so each party bears their own costs\n• You must send a <strong>Letter Before Action (LBA)</strong> before issuing a claim — courts expect this\n• The defendant has <strong>14 days</strong> to respond to your claim once issued\n• If they do not respond, you can apply for a <strong>default judgment</strong>\n• Claims are submitted online at <strong>gov.uk/make-court-claim-for-money</strong> (Money Claim Online / MCOL)\n\nFor personal injury claims, the limit is £1,500. For housing disrepair, it is £1,000.`,
    urgency: 'medium',
    actions: [
      { title: 'Send a formal Letter Before Action (LBA)', detail: 'This is required before issuing a claim. Give the defendant 14 days to respond. State the amount you are claiming, the reason, and that you will issue court proceedings if they do not pay.', urgent: false },
      { title: 'Gather all your evidence', detail: 'Collect contracts, invoices, photographs, correspondence, and any witness statements. The stronger your evidence pack, the more likely the defendant will settle before a hearing.', urgent: false },
      { title: 'Submit your claim online', detail: 'Go to gov.uk/make-court-claim-for-money. You will need the defendant\'s full name and address, the amount claimed, and a brief description of why you are claiming.', urgent: false },
      { title: 'Consider mediation', detail: 'The court will likely suggest free mediation before a hearing. Many cases settle through mediation — it is faster and less stressful than a court hearing.', urgent: false },
      { title: 'Prepare for the hearing', detail: 'If the case goes to a hearing, organise your documents in date order, prepare a clear summary of your case, and bring three copies of everything (judge, defendant, yourself).', urgent: false },
    ],
    evidence: [
      'Your Letter Before Action and proof of delivery',
      'The defendant\'s response (or evidence of no response)',
      'Contract, agreement, or invoice',
      'Proof of payment made',
      'Photographs or other evidence of the problem',
      'Any correspondence between you and the defendant',
      'Independent quotes or assessments if relevant',
      'Witness statements',
    ],
    letterType: 'letter_before_action',
  },

  // ── BENEFITS ─────────────────────────────────────────────────────────
  uc_dispute: {
    title: 'Universal Credit Dispute',
    rights: `If you disagree with a Universal Credit decision, you have the right to challenge it through a formal process:\n\n<strong>Step 1 — Mandatory Reconsideration (MR)</strong>: You must request an MR within <strong>1 month</strong> of the decision. The DWP must look at the decision again. Request this in writing through your UC journal or by calling the UC helpline (0800 328 5644).\n\n<strong>Step 2 — Appeal to Tribunal</strong>: If the MR confirms the original decision, you have <strong>1 month from the MR notice</strong> to appeal to the Social Security and Child Support Tribunal (SSCS Tribunal). Appeals are free and heard by an independent panel.\n\nFor <strong>sanctions</strong>, the DWP must show your behaviour was not reasonable. Many sanctions are overturned on appeal.\n\nFor <strong>overpayment recovery</strong>, you can challenge whether the overpayment was caused by official error and request a waiver.`,
    urgency: 'medium',
    actions: [
      { title: 'Request a Mandatory Reconsideration within 1 month', detail: 'Write in your UC journal or call 0800 328 5644 to request an MR. Explain clearly why you think the decision is wrong and include any supporting evidence.', urgent: true },
      { title: 'Get a written MR decision notice', detail: 'Make sure you receive the MR decision in writing — you need this to appeal to tribunal. If you only get a journal message, ask for a formal written notice.', urgent: false },
      { title: 'Appeal to SSCS Tribunal within 1 month of MR decision', detail: 'Use form SSCS1 (available at gov.uk) or appeal online. Appeals are free. You can request a paper hearing, telephone, or face-to-face hearing.', urgent: false },
      { title: 'Get help from Citizens Advice', detail: 'Citizens Advice (0800 144 8848) provide free, specialist benefits advice and can help you write your MR request and appeal. Many areas have specialist welfare rights advisers.', urgent: false },
      { title: 'Request advance payment if you are in hardship', detail: 'If you are waiting for a UC decision and have no money, you can request a Hardship Payment or Budgeting Advance through your UC journal.', urgent: false },
    ],
    evidence: [
      'The DWP decision letter or journal message',
      'Your Mandatory Reconsideration request (keep a copy)',
      'MR decision notice from DWP',
      'Any medical evidence or fit notes',
      'Evidence of job searching or work-related activity if sanctions are involved',
      'Bank statements showing financial hardship',
      'Any previous UC correspondence',
      'SSCS1 appeal form once completed',
    ],
    letterType: 'uc_mandatory_reconsideration',
  },

  benefits_appeal: {
    title: 'Benefits Appeal',
    rights: `You have the right to appeal most DWP benefit decisions to an independent <strong>Social Security and Child Support (SSCS) Tribunal</strong>.\n\nThe appeal process:\n1. <strong>Mandatory Reconsideration</strong> — must be completed first (within 1 month of the original decision)\n2. <strong>Tribunal appeal</strong> — must be submitted within 1 month of the MR decision (using form SSCS1)\n3. <strong>Upper Tribunal</strong> — if a point of law was wrongly decided at the first tribunal\n\nTribunals are independent of the DWP and overturn a significant proportion of appeals — for PIP, around <strong>60–70% of appeals that reach a hearing are successful</strong>.\n\nYou can be represented at tribunal by a welfare rights adviser, Citizens Advice worker, or solicitor. You do not need a lawyer but specialist support significantly improves success rates.`,
    urgency: 'medium',
    actions: [
      { title: 'Complete the Mandatory Reconsideration first if not done', detail: 'You cannot appeal to tribunal without an MR decision. Request this within 1 month of the original decision by contacting the benefit office in writing.', urgent: true },
      { title: 'Submit your tribunal appeal within 1 month of the MR decision', detail: 'Use form SSCS1 (download from gov.uk/appeal-benefit-decision). Send it to HMCTS. Appeals are free. Late appeals can be accepted with good reason.', urgent: true },
      { title: 'Gather strong supporting evidence', detail: 'Medical evidence (letters from GPs, consultants, care workers) is crucial, especially for PIP and ESA appeals. Ask your GP for a letter specifically addressing your functional ability.', urgent: false },
      { title: 'Consider requesting an oral hearing', detail: 'You have a much higher success rate at an in-person or telephone hearing than a paper hearing. Request an oral hearing when submitting your appeal form.', urgent: false },
      { title: 'Get specialist support for your hearing', detail: 'Contact Citizens Advice (0800 144 8848), your local welfare rights service, or a disability charity for help preparing your case. Representation at tribunal dramatically improves outcomes.', urgent: false },
    ],
    evidence: [
      'Original benefit decision letter',
      'Mandatory Reconsideration request and MR decision notice',
      'SSCS1 appeal form',
      'Medical evidence: GP letters, consultant reports, care plans',
      'Personal statement describing how your condition affects daily life',
      'Witness statements from carers or family members',
      'Any previous assessments or reports from the DWP',
      'Diary of how your condition varies day to day',
    ],
    letterType: 'benefits_appeal_letter',
  },

  // ── FAMILY ───────────────────────────────────────────────────────────
  child_contact: {
    title: 'Child Contact Dispute',
    rights: `Under the <strong>Children Act 1989</strong>, the welfare of the child is the court's paramount consideration. Both parents generally have the right to maintain a relationship with their child, and courts presume that involvement of both parents is in the child's best interests unless there is evidence of risk.\n\n<strong>Child Arrangements Orders</strong> (formerly residence and contact orders) are made under Section 8 of the Children Act 1989 and set out where a child lives and the time they spend with each parent.\n\nBefore applying to court, you must usually attend a <strong>Mediation Information and Assessment Meeting (MIAM)</strong> — exemptions apply in cases involving domestic abuse, child protection concerns, or where the other party refuses to engage.\n\nBreaching a Child Arrangements Order without good reason can result in enforcement proceedings, including unpaid work requirements or committal to prison in serious cases.\n\nThe <strong>Child Maintenance Service (CMS)</strong> handles financial support separately from contact arrangements.`,
    urgency: 'medium',
    actions: [
      { title: 'Prioritise the child\'s safety above all else', detail: 'If you believe the child is at immediate risk of harm, contact the police (999) or social services immediately. Do not delay in the interests of avoiding conflict.', urgent: true },
      { title: 'Attend a MIAM (Mediation Information and Assessment Meeting)', detail: 'This is required before most court applications. A mediator will assess whether mediation is suitable. Contact a family mediator through familymediationcouncil.org.uk.', urgent: false },
      { title: 'Try to agree arrangements in writing', detail: 'A written co-parenting agreement, while not legally binding, sets clear expectations and demonstrates good faith if you later need to go to court.', urgent: false },
      { title: 'Apply for a Child Arrangements Order if necessary', detail: 'Use Form C100 (available at gov.uk) to apply to the family court. The application fee is £232. Many people do this without a solicitor using the guidance at cafcass.gov.uk.', urgent: false },
      { title: 'Contact CAFCASS for guidance', detail: 'The Children and Family Court Advisory and Support Service (CAFCASS) supports children and families involved in family court. Visit cafcass.gov.uk or call 0300 456 4000.', urgent: false },
    ],
    evidence: [
      'Any existing court orders relating to the child',
      'Written records of agreed contact arrangements',
      'Log of missed or refused contact (dates and circumstances)',
      'Any communications from the other parent about contact',
      'Evidence of the child\'s wishes (if age-appropriate)',
      'School or medical records showing your involvement',
      'Evidence of domestic abuse or safeguarding concerns if applicable',
      'MIAM attendance certificate',
    ],
    letterType: 'child_contact_letter',
  },

  coparenting: {
    title: 'Co-parenting Agreement',
    rights: `Co-parenting agreements are not legally binding in England and Wales unless made into a court order, but they provide a clear written framework that both parents can refer to and that courts will consider if disputes arise.\n\nKey areas typically covered include:\n• <strong>Contact schedule</strong> — regular weekly arrangements and holiday splits\n• <strong>Education decisions</strong> — school choice, parents' evenings, school trips\n• <strong>Medical decisions</strong> — consent for treatment, GP registration\n• <strong>Communication</strong> — how parents communicate about the child, response times\n• <strong>Financial arrangements</strong> — maintenance (handled by CMS), school costs, activities\n\nUnder the <strong>Children Act 1989</strong>, both parents with parental responsibility have equal rights to make decisions about the child's upbringing. A co-parenting agreement works best when both parties commit to it voluntarily.\n\nIf the agreement breaks down, either parent can apply to the family court for a <strong>Child Arrangements Order</strong>.`,
    urgency: 'low',
    actions: [
      { title: 'Identify all key areas to agree on', detail: 'Before drafting anything, list all decisions that need to be made: contact schedule, holidays, school, medical, communication, and finances. Work through each systematically.', urgent: false },
      { title: 'Consider using a family mediator', detail: 'A mediator can help you both reach agreement on disputed areas in a neutral setting. This is far cheaper than court and produces more durable agreements. Find one at familymediationcouncil.org.uk.', urgent: false },
      { title: 'Put the agreement in writing', detail: 'Once agreed, put the full arrangement in writing and have both parents sign it. Keep copies. While not legally binding, it provides a clear reference point.', urgent: false },
      { title: 'Consider making it a court order', detail: 'You can apply to the family court for a "consent order" which turns your agreement into a legally enforceable court order. This provides greater security for both parties.', urgent: false },
      { title: 'Review the agreement regularly', detail: 'Children\'s needs change. Build in a review process — for example, every 6 or 12 months — so the agreement evolves as your child grows.', urgent: false },
    ],
    evidence: [
      'Any previous written agreements between parents',
      'Existing court orders if applicable',
      'School information (term dates, holidays)',
      'Record of current contact arrangements',
      'Any mediation notes or memorandum of understanding',
    ],
    letterType: 'coparenting_agreement',
  },

  ex_harassment: {
    title: 'Harassment from Ex-Partner',
    rights: `Harassment by an ex-partner is a serious matter covered by multiple laws:\n\n<strong>Protection from Harassment Act 1997</strong>: It is a criminal offence to pursue a course of conduct (two or more incidents) that causes another person to fear violence or that amounts to harassment. This carries up to 10 years imprisonment.\n\n<strong>Stalking</strong> (Section 2A and 4A, Protection from Harassment Act 1997): Specific stalking offences were introduced in 2012 and carry up to 10 years imprisonment.\n\n<strong>Non-Molestation Orders</strong> (Family Law Act 1996): Available from the family court, these legally prohibit the abusive person from contacting you or coming near you. Breach is a criminal offence carrying up to 5 years imprisonment.\n\n<strong>Domestic abuse</strong> (Domestic Abuse Act 2021): Covers psychological, emotional, and coercive control as well as physical abuse between intimate partners and family members.\n\nYou can apply for a non-molestation order without the other person knowing (without notice) in urgent cases.`,
    urgency: 'high',
    actions: [
      { title: 'Contact the police if you feel unsafe', detail: 'Call 999 in an emergency or 101 for non-emergency reports. Harassment and stalking by an ex-partner are criminal offences. Always get a crime reference number.', urgent: true },
      { title: 'Apply for a Non-Molestation Order', detail: 'This is a court order prohibiting the person from contacting or approaching you. Apply using Form FL401 at your local family court. You do not need a solicitor. In urgent cases, the court can grant it the same day without notifying the other person.', urgent: true },
      { title: 'Contact the National Domestic Abuse Helpline', detail: 'Call 0808 2000 247 (free, 24/7) or visit nationaldahelpline.org.uk. They can provide immediate support and help you access specialist services including legal advice.', urgent: false },
      { title: 'Block all contact channels and document everything', detail: 'Block on all platforms, but before blocking, screenshot and save all messages, calls, and social media activity. This evidence is crucial for police and court applications.', urgent: false },
      { title: 'Inform trusted people', detail: 'Tell your employer, school, or trusted neighbours so they can help keep you safe and be witnesses if the person approaches those locations.', urgent: false },
    ],
    evidence: [
      'Log of all incidents (dates, times, what happened)',
      'Screenshots of all messages, social media contact, and emails',
      'Call logs showing repeated contact attempts',
      'Photographs of any damage to property or physical injuries',
      'Witness statements from those who have seen the harassment',
      'Police crime reference number(s)',
      'Any previous court orders (non-molestation, occupation order)',
      'Medical records if physical or psychological harm has occurred',
    ],
    letterType: 'ex_harassment_warning',
  },

  separation_letter: {
    title: 'Separation Communication Letter',
    rights: `When a relationship ends, written communication can help establish clear boundaries, confirm arrangements, and create a record of what has been agreed. While separation letters are not legal documents in themselves, they:\n\n• Provide a written record of communications which can be used as evidence if disputes arise\n• Help establish clear boundaries around contact, especially where there is a risk of harassment\n• Confirm agreed arrangements for children, property, or finances\n• Can form the basis of a formal legal agreement if reviewed by a solicitor\n\nIf you are married or in a civil partnership, formal separation has legal implications for finances and property under the <strong>Matrimonial Causes Act 1973</strong>. A formal separation agreement or divorce petition may be needed for financial matters to be legally binding.\n\nFor cohabiting couples, the <strong>Trusts of Land and Appointment of Trustees Act 1996 (TOLATA)</strong> governs property disputes.`,
    urgency: 'low',
    actions: [
      { title: 'Be clear and factual in all written communication', detail: 'Keep letters or emails focused on practical matters. Avoid emotional language that could escalate conflict or be used against you later.', urgent: false },
      { title: 'Confirm key arrangements in writing', detail: 'Where you have agreed arrangements for children, property, or finances, confirm these in a letter or email immediately after any verbal discussion.', urgent: false },
      { title: 'Set clear communication boundaries', detail: 'If you want to limit contact to certain topics (e.g. children only) or certain channels (e.g. email only), state this clearly and consistently.', urgent: false },
      { title: 'Seek legal advice for financial matters', detail: 'If you are married, any financial settlement should be formalised through a court consent order to be legally binding. A solicitor can advise on your entitlements.', urgent: false },
      { title: 'Consider a solicitor\'s letter for serious disputes', detail: 'If communication has broken down or the other party is not cooperating, a formal letter from a solicitor carries more weight and signals you are serious about protecting your legal rights.', urgent: false },
    ],
    evidence: [
      'All previous written communications between you',
      'Any existing agreements about children, property, or finances',
      'Evidence of what has been agreed verbally (diary notes, witness accounts)',
      'Marriage certificate or civil partnership certificate if applicable',
      'Property documents if relevant',
      'Children\'s details if arrangements are being confirmed',
    ],
    letterType: 'separation_communication',
  },

  // ── MEDICAL ──────────────────────────────────────────────────────────
  gp_complaint: {
    title: 'GP Complaint',
    rights: `You have the right to make a complaint about NHS care under the <strong>NHS Constitution for England</strong>, which gives patients the right to have complaints investigated and to receive a full response.\n\nThe NHS complaints process has two stages:\n1. <strong>Local resolution</strong> — complain directly to the GP practice. They must acknowledge within 3 working days and respond fully within 40 working days.\n2. <strong>Parliamentary and Health Service Ombudsman (PHSO)</strong> — if local resolution fails, you can escalate free of charge.\n\nComplaints must generally be made within <strong>12 months</strong> of the incident. For serious concerns about a GP's fitness to practise, report to the <strong>General Medical Council (GMC)</strong> at gmc-uk.org.`,
    urgency: 'medium',
    actions: [
      { title: 'Submit a formal written complaint to the Practice Manager', detail: 'Set out what happened, when, who was involved, and what outcome you want. They must acknowledge within 3 working days and respond within 40 working days.', urgent: false },
      { title: 'Contact NHS England if the practice does not resolve it', detail: 'Escalate to NHS England at england.nhs.uk/contact-us/complaint if the practice\'s response is unsatisfactory.', urgent: false },
      { title: 'Refer to the Parliamentary and Health Service Ombudsman', detail: 'If local resolution fails, contact the PHSO at ombudsman.org.uk or 0345 015 4033. Free and independent.', urgent: false },
      { title: 'Report to the GMC for serious fitness to practise concerns', detail: 'If you have concerns about a doctor\'s conduct or competence affecting patient safety, report to gmc-uk.org/concerns.', urgent: false },
      { title: 'Seek legal advice for clinical negligence', detail: 'If negligent care caused you harm, consult a clinical negligence solicitor — many work on no-win no-fee.', urgent: false },
    ],
    evidence: [
      'Full written account of what happened (dates, times, staff names)',
      'Copies of prescriptions, referral letters, or test results',
      'Your GP records (request via Subject Access Request)',
      'Correspondence with the practice about this issue',
      'Witness details if anyone accompanied you',
      'Medical evidence of any harm caused',
      'Your complaint letter and any responses received',
    ],
    letterType: 'gp_complaint_letter',
  },

  hospital_complaint: {
    title: 'Hospital Complaint',
    rights: `Under the <strong>NHS Constitution</strong> and the <strong>Local Authority Social Services and NHS Complaints Regulations 2009</strong>, you have the right to have your complaint investigated promptly.\n\nKey rights:\n• Acknowledgement within <strong>3 working days</strong>\n• Full written response within <strong>40 working days</strong>\n• The right to escalate to the <strong>Parliamentary and Health Service Ombudsman (PHSO)</strong>\n\nSerious patient safety concerns can also be reported to the <strong>Care Quality Commission (CQC)</strong> at cqc.org.uk, which regulates all health and social care providers.\n\nFor clinical negligence claims, the limitation period is generally <strong>3 years</strong> from the date of negligence or when you first became aware of it.`,
    urgency: 'medium',
    actions: [
      { title: 'Contact PALS for informal resolution', detail: 'Every NHS hospital has a Patient Advice and Liaison Service. They can often resolve issues quickly. Find yours at nhs.uk/pals.', urgent: false },
      { title: 'Submit a formal written complaint to the hospital', detail: 'Write to the Chief Executive or Complaints Manager. Set out clearly what happened, who was involved, when, and what outcome you want.', urgent: false },
      { title: 'Request your medical records via SAR', detail: 'Submit a Subject Access Request to the medical records department. Free under GDPR, must be provided within 1 month.', urgent: false },
      { title: 'Escalate to the PHSO if not resolved', detail: 'Contact the Parliamentary and Health Service Ombudsman at ombudsman.org.uk if the hospital\'s response is unsatisfactory.', urgent: false },
      { title: 'Report safety concerns to the CQC', detail: 'The Care Quality Commission (cqc.org.uk or 03000 616161) investigates concerns about patient safety and quality of care.', urgent: false },
    ],
    evidence: [
      'Detailed written account (dates, times, ward, staff names)',
      'Hospital letters, discharge summaries, appointment letters',
      'Medical records obtained via SAR',
      'Photographs of any harm or conditions if relevant',
      'Witness statements from family or friends present',
      'Correspondence with the hospital',
      'Evidence of financial losses caused',
    ],
    letterType: 'hospital_complaint_letter',
  },

  misdiagnosis: {
    title: 'Misdiagnosis Concern',
    rights: `A misdiagnosis may constitute <strong>clinical negligence</strong> if it falls below the standard of a reasonably competent medical professional and causes harm.\n\nTo succeed in a clinical negligence claim you must prove:\n1. <strong>Duty of care</strong> — owed by the healthcare provider (almost always established)\n2. <strong>Breach</strong> — care fell below the standard of a reasonable body of medical opinion (<em>Bolam test</em>)\n3. <strong>Causation</strong> — the breach caused harm that would not otherwise have occurred\n\nThe limitation period is generally <strong>3 years</strong> from the date of negligence or from when you first had knowledge of it.\n\nBefore pursuing a legal claim you have the right to a full explanation through the <strong>NHS complaints process</strong>, access to your medical records (free under UK GDPR), and a second medical opinion.`,
    urgency: 'high',
    actions: [
      { title: 'Obtain a second medical opinion', detail: 'Ask your GP for a specialist referral or seek a private second opinion. This confirms whether a misdiagnosis occurred and establishes your correct diagnosis.', urgent: true },
      { title: 'Request your full medical records via SAR', detail: 'Submit a Subject Access Request to every relevant provider. Free under UK GDPR, must be provided within 1 month. These are the foundation of any complaint or claim.', urgent: false },
      { title: 'Submit a formal NHS complaint', detail: 'Complain in writing asking for a full explanation of the clinical decisions made. This does not affect your right to bring a legal claim later.', urgent: false },
      { title: 'Contact a clinical negligence solicitor', detail: 'If you have suffered harm, consult a specialist solicitor. Many offer free initial consultations and work on no-win no-fee. Find one at apil.org.uk.', urgent: false },
      { title: 'Report to the GMC if conduct was seriously below standard', detail: 'The General Medical Council (gmc-uk.org) investigates concerns about doctors\' fitness to practise where patient safety is at risk.', urgent: false },
    ],
    evidence: [
      'Medical records from all relevant providers',
      'Written account of symptoms reported and when',
      'Records of all appointments (dates, diagnosis given)',
      'The correct diagnosis and when it was eventually made',
      'Second medical opinion confirming misdiagnosis',
      'Evidence of harm caused (worsened condition, further treatment)',
      'Financial losses (time off work, private treatment costs)',
    ],
    letterType: 'misdiagnosis_complaint',
  },

  medical_records: {
    title: 'Access to Medical Records (SAR)',
    rights: `Under <strong>UK GDPR Article 15</strong> and the <strong>Data Protection Act 2018</strong>, you have the right to access personal data held about you — including medical records — through a <strong>Subject Access Request (SAR)</strong>.\n\nKey rights:\n• Records must be provided <strong>free of charge</strong>\n• The organisation must respond within <strong>1 calendar month</strong>\n• You do not have to give a reason for your request\n• The period can be extended by 2 months for complex requests, but you must be informed\n\nIf access is refused or records are incomplete, you can complain to the <strong>Information Commissioner's Office (ICO)</strong> at ico.org.uk, which has powers to require organisations to comply.`,
    urgency: 'low',
    actions: [

//  AI LETTER GENERATION via Anthropic API
//  Personalises letters using the Claude API if user provides details.
// ═══════════════════════════════════════════════════════════════════════

async function generateAILetter(issueId, userData, answers) {
  const issueLabels = { deposit: 'deposit not returned', repairs: 'repairs ignored', harassment: 'landlord harassment', eviction: 'illegal eviction' };
  const prompt = `You are a UK legal letter writing assistant specialising in tenant rights.

Write a formal, professional legal letter for the following tenant situation:

Issue: ${issueLabels[issueId]}
Tenant name: ${userData.yourName || 'the tenant'}
Property address: ${userData.propertyAddress || 'the property'}
Landlord name: ${userData.landlordName || 'the landlord'}
Landlord address: ${userData.landlordAddress || '[Landlord Address]'}
Additional details: ${userData.extraDetails || 'None provided'}
Questionnaire answers: ${JSON.stringify(answers)}

Write the letter in the style of a formal legal letter from a UK solicitor. Include:
- Relevant UK legislation (Housing Act 1988/2004, Protection from Eviction Act 1977, Landlord and Tenant Act 1985, etc.)
- Specific demands with clear deadlines
- Consequences if demands are not met
- Professional closing

Today's date: ${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}

Reply with ONLY the letter text, no preamble or explanation.`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  const data = await response.json();
  if (data.content && data.content[0]) return data.content[0].text;
  throw new Error('No response from AI');
}

//  PDF EXPORT (jsPDF)
// ═══════════════════════════════════════════════════════════════════════

function exportLetterPDF(letterText, issueTitle) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  const pageW = doc.internal.pageSize.getWidth();
  const margin = 22;
  const lineW = pageW - margin * 2;

  // Header bar
  doc.setFillColor(15, 30, 53);
  doc.rect(0, 0, pageW, 18, 'F');
  doc.setTextColor(232, 160, 32);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'bold');
  doc.text('LegalShield AI — UK Tenant Rights', margin, 12);
  doc.setTextColor(160, 180, 200);
  doc.setFontSize(7.5);
  doc.setFont('helvetica', 'normal');
  doc.text('NOT LEGAL ADVICE — For guidance only. Consult a qualified solicitor for your specific situation.', pageW - margin, 12, { align: 'right' });

  // Title
  doc.setTextColor(15, 30, 53);
  doc.setFontSize(13);
  doc.setFont('helvetica', 'bold');
  doc.text(issueTitle, margin, 32);
  doc.setDrawColor(232, 160, 32);
  doc.setLineWidth(0.8);
  doc.line(margin, 35, margin + 60, 35);

  // Letter body
  doc.setFont('times', 'normal');
  doc.setFontSize(10.5);
  doc.setTextColor(44, 62, 88);

  const lines = doc.splitTextToSize(letterText, lineW);
  let y = 44;
  const pageH = doc.internal.pageSize.getHeight();

  lines.forEach(line => {
    if (y > pageH - 25) {
      doc.addPage();
      // Small header on new pages
      doc.setFillColor(15, 30, 53);
      doc.rect(0, 0, pageW, 10, 'F');
      y = 20;
      doc.setFont('times', 'normal');
      doc.setFontSize(10.5);
      doc.setTextColor(44, 62, 88);
    }
    doc.text(line, margin, y);
    y += 5.5;
  });

  // Footer
  const fY = pageH - 12;
  doc.setDrawColor(200, 210, 220);
  doc.setLineWidth(0.3);
  doc.line(margin, fY - 4, pageW - margin, fY - 4);
  doc.setFontSize(7.5);
  doc.setTextColor(120, 140, 160);
  doc.setFont('helvetica', 'normal');
  doc.text(`Generated ${new Date().toLocaleDateString('en-GB')} by LegalShield AI`, margin, fY);
  doc.text('legalshield.ai', pageW - margin, fY, { align: 'right' });

  doc.save(`LegalShield_Letter_${issueTitle.replace(/\s+/g, '_')}.pdf`);
}

function checkProAccess() {
  // Check URL for pro code (set by Stripe success redirect)

// ── QUESTION FLOW ──────────────────────────────────────────────────────
function QuestionFlow({ issueId, mode, onComplete, onBack }) {
  const questions = DECISION_TREES[issueId];
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [selected, setSelected] = useState(null);

  const current = questions[step];
  const progress = ((step + 1) / (questions.length + 1)) * 100;

  function handleAnswer(answer) {
    setSelected(answer);
  }

  function handleNext() {
    const newAnswers = { ...answers, [current.id]: selected };
    setAnswers(newAnswers);
    setSelected(null);
    if (step < questions.length - 1) {
      setStep(step + 1);
    } else {
      onComplete(newAnswers);
    }
  }

  return (
    <div className="section section-sm" style={{ margin: '0 auto', paddingTop: '2.5rem' }}>
      <div className="breadcrumb">
        <span className="breadcrumb-link" onClick={onBack}>← Back</span>
        <span className="breadcrumb-sep">›</span>
        <span>{LEGAL_DATA[issueId].title}</span>
      </div>
      <div className="question-card">
        <div className="question-progress">
          <div className="question-progress-bar" style={{ width: `${progress}%` }} />
        </div>
        <p className="question-label">Question {step + 1} of {questions.length}</p>
        <h3 className="question-text">{current.question}</h3>
        {current.hint && <p className="question-hint">{current.hint}</p>}
        <div className="answer-options">
          {current.answers.map(ans => (
            <button
              key={ans}
              className={`answer-option${selected === ans ? ' selected' : ''}`}
              onClick={() => handleAnswer(ans)}
            >
              {ans}
            </button>
          ))}
        </div>
        <div style={{ marginTop: '1.5rem', display: 'flex', gap: '0.8rem', justifyContent: 'flex-end' }}>
          {step > 0 && <button className="btn btn-ghost" onClick={() => setStep(s => s - 1)}>Back</button>}
          <button className="btn btn-primary" disabled={!selected} onClick={handleNext}>
            {step < questions.length - 1 ? 'Next →' : mode === 'rights' ? 'See My Rights →' : 'Continue to Letter →'}
          </button>
        </div>
      </div>
    </div>
  );
}

  // screen: home | select | questions | details | results
  const [screen, setScreen] = useState('home');
  const [mode, setMode] = useState(null);       // 'rights' | 'letter'
  const [issueId, setIssueId] = useState(null);
  const [answers, setAnswers] = useState({});
  const [userData, setUserData] = useState(null);

  function goHome() {
    setScreen('home'); setMode(null); setIssueId(null);
    setAnswers({}); setUserData(null);
  }

  function startFlow(m) {
    setMode(m); setScreen('select');
  }

  function handleIssueSelect(id, overrideScreen) {
    if (overrideScreen === 'home') { goHome(); return; }
    setIssueId(id);
    setScreen('questions');
  }

  function handleAnswersComplete(ans) {
    setAnswers(ans);
    if (mode === 'letter') {
      setScreen('details');
    } else {
      // Rights check — show results with empty userData
      setUserData({});
      setScreen('results');
    }
  }

  function handleDetailsComplete(data) {
    setUserData(data);
    setScreen('results');
  }

  return (
    <div className="app-shell">
      <Nav onHome={goHome} />
      <main className="main-content">
        {screen === 'home' && <HomePage onStart={startFlow} />}
        {screen === 'select' && (
          <IssueSelector
            mode={mode}
            onSelect={handleIssueSelect}
          />
        )}
        {screen === 'questions' && issueId && (
          <QuestionFlow
            issueId={issueId}
            mode={mode}
            onComplete={handleAnswersComplete}
            onBack={() => setScreen('select')}
          />
        )}
        {screen === 'details' && issueId && (
          <DetailsForm
            issueId={issueId}
            answers={answers}
            onComplete={handleDetailsComplete}
            onBack={() => setScreen('questions')}
          />
        )}
        {screen === 'results' && issueId && (
          <ResultsPage
            issueId={issueId}
            answers={answers}
            userData={userData}
            mode={mode}
            onBack={() => setScreen(mode === 'letter' ? 'details' : 'questions')}
            onNewIssue={goHome}
          />
        )}
      </main>
      <Footer />
    </div>
  );
}

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
