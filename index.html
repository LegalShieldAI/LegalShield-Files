<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegalShield AI – UK Legal Rights Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── DESIGN TOKENS ─────────────────────────────────────────────── */
    :root {
      --navy:      #0f1e35;
      --navy-mid:  #162a47;
      --navy-soft: #1e3a5f;
      --slate:     #4a6080;
      --slate-lt:  #7a94b0;
      --amber:     #e8a020;
      --amber-lt:  #f5c75a;
      --off-white: #f0f4f9;
      --white:     #ffffff;
      --muted:     #d0dae8;
      --success:   #2ecc8a;
      --danger:    #e85050;
      --text-body: #2c3e58;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body:    'Inter', system-ui, sans-serif;
      --radius:    10px;
      --shadow:    0 4px 24px rgba(15,30,53,0.12);
      --shadow-lg: 0 12px 48px rgba(15,30,53,0.18);
    }

    /* ── RESET & BASE ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--off-white);
      color: var(--text-body);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── LAYOUT ─────────────────────────────────────────────────────── */
    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
    .main-content { flex: 1; }

    /* ── NAVIGATION ─────────────────────────────────────────────────── */
    .nav {
      background: var(--navy);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      text-decoration: none;
    }
    .nav-shield {
      width: 32px; height: 36px;
      background: var(--amber);
      clip-path: polygon(50% 0%, 100% 15%, 100% 65%, 50% 100%, 0% 65%, 0% 15%);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      color: var(--navy);
      font-weight: 700;
      flex-shrink: 0;
    }
    .nav-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--white);
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .nav-title span { color: var(--amber); }
    .nav-disclaimer {
      font-size: 0.72rem;
      color: var(--slate-lt);
      max-width: 320px;
      text-align: right;
      display: none;
    }
    @media (min-width: 768px) { .nav-disclaimer { display: block; } }

    /* ── HERO ───────────────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(145deg, var(--navy) 0%, var(--navy-soft) 60%, #1b3d6e 100%);
      color: var(--white);
      padding: 5rem 2rem 6rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(232,160,32,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 50%, rgba(30,58,95,0.6) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-eyebrow {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--amber);
      font-weight: 600;
      margin-bottom: 1.2rem;
      position: relative;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.15;
      max-width: 720px;
      margin: 0 auto 1.2rem;
      position: relative;
    }
    .hero h1 em {
      font-style: normal;
      color: var(--amber);
      border-bottom: 2px solid var(--amber);
    }
    .hero-sub {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
      position: relative;
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 0.3rem 0.9rem;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2rem;
      position: relative;
    }
    .hero-badge::before {
      content: '●';
      color: var(--success);
      font-size: 0.5rem;
    }

    /* ── BUTTONS ────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.6rem;
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.18s ease;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--amber);
      color: var(--navy);
    }
    .btn-primary:hover { background: var(--amber-lt); box-shadow: 0 4px 20px rgba(232,160,32,0.4); }
    .btn-secondary {
      background: rgba(255,255,255,0.12);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }
    .btn-outline {
      background: transparent;
      color: var(--navy);
      border: 2px solid var(--navy);
    }
    .btn-outline:hover { background: var(--navy); color: var(--white); }
    .btn-ghost {
      background: transparent;
      color: var(--slate);
      padding: 0.5rem 1rem;
    }
    .btn-ghost:hover { color: var(--navy); background: var(--off-white); }
    .btn-danger-outline {
      background: transparent;
      color: var(--danger);
      border: 2px solid var(--danger);
    }
    .btn-success {
      background: var(--success);
      color: var(--navy);
    }
    .btn-success:hover { opacity: 0.9; }
    .btn-navy {
      background: var(--navy);
      color: var(--white);
    }
    .btn-navy:hover { background: var(--navy-soft); }
    .btn-lg { padding: 1rem 2.2rem; font-size: 1.05rem; border-radius: 12px; }
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }
    .btn-block { width: 100%; justify-content: center; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── DASHBOARD ──────────────────────────────────────────────────── */
    .dashboard {
      max-width: 860px;
      margin: -2.5rem auto 0;
      padding: 0 1.5rem 4rem;
      position: relative;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 600px) { .dashboard-grid { grid-template-columns: 1fr; } }

    .dash-card {
      background: var(--white);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .dash-card:hover {
      border-color: var(--amber);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    .dash-card-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--navy-mid), var(--navy-soft));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .dash-card h3 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: var(--navy);
    }
    .dash-card p { font-size: 0.88rem; color: var(--slate); line-height: 1.5; }
    .dash-card .arrow {
      margin-top: auto;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--amber);
      letter-spacing: 0.02em;
    }

    /* ── SECTION ────────────────────────────────────────────────────── */
    .section { max-width: 860px; margin: 0 auto; padding: 3rem 1.5rem; }
    .section-sm { max-width: 640px; }
    .section-title {
      font-family: var(--font-display);
      font-size: 1.7rem;
      color: var(--navy);
      margin-bottom: 0.4rem;
    }
    .section-sub { color: var(--slate); font-size: 0.92rem; margin-bottom: 2rem; }

    /* ── ISSUE SELECTOR ─────────────────────────────────────────────── */
    .issue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .issue-card {
      background: var(--white);
      border-radius: 12px;
      padding: 1.4rem;
      cursor: pointer;
      border: 2px solid var(--muted);
      transition: all 0.18s ease;
      text-align: center;
    }
    .issue-card:hover, .issue-card.selected {
      border-color: var(--amber);
      background: #fffbf2;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(232,160,32,0.15);
    }
    .issue-card .issue-icon { font-size: 2rem; margin-bottom: 0.5rem; display: block; }
    .issue-card h4 { font-size: 0.92rem; font-weight: 600; color: var(--navy); }

    /* ── QUESTION FLOW ──────────────────────────────────────────────── */
    .question-card {
      background: var(--white);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: var(--shadow);
      max-width: 640px;
      margin: 0 auto;
    }
    .question-progress {
      height: 4px;
      background: var(--muted);
      border-radius: 2px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .question-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--amber), var(--amber-lt));
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .question-label {
      font-size: 0.78rem;
      color: var(--slate);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.7rem;
    }
    .question-text {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--navy);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    .question-hint { font-size: 0.83rem; color: var(--slate); margin-bottom: 1.5rem; }

    .answer-options { display: flex; flex-direction: column; gap: 0.7rem; }
    .answer-option {
      padding: 0.9rem 1.2rem;
      border: 2px solid var(--muted);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-body);
      background: var(--white);
      text-align: left;
    }
    .answer-option:hover {
      border-color: var(--amber);
      background: #fffbf2;
    }
    .answer-option.selected {
      border-color: var(--navy);
      background: var(--navy);
      color: var(--white);
    }

    .form-group { margin-bottom: 1.2rem; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--navy); margin-bottom: 0.4rem; }
    .form-input, .form-textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid var(--muted);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--text-body);
      background: var(--white);
      transition: border-color 0.15s;
      outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--amber); }
    .form-textarea { min-height: 90px; resize: vertical; }

    /* ── RESULTS ────────────────────────────────────────────────────── */
    .results-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
      color: var(--white);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .results-header::after {
      content: '';
      position: absolute;
      right: -20px; top: -20px;
      width: 140px; height: 160px;
      background: var(--amber);
      opacity: 0.06;
      clip-path: polygon(50% 0%, 100% 15%, 100% 65%, 50% 100%, 0% 65%, 0% 15%);
    }
    .results-badge {
      display: inline-block;
      background: rgba(46,204,138,0.2);
      color: var(--success);
      border: 1px solid rgba(46,204,138,0.4);
      border-radius: 999px;
      padding: 0.25rem 0.8rem;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }
    .results-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      margin-bottom: 0.4rem;
    }
    .results-sub { font-size: 0.88rem; color: var(--muted); }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 640px) { .results-grid { grid-template-columns: 1fr; } }

    .result-panel {
      background: var(--white);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }
    .result-panel.full { grid-column: 1 / -1; }
    .panel-title {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--amber);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .rights-summary { font-size: 0.9rem; line-height: 1.7; color: var(--text-body); }
    .rights-summary strong { color: var(--navy); }

    /* ── ACTION PLAN ────────────────────────────────────────────────── */
    .action-list { list-style: none; }
    .action-item {
      display: flex;
      gap: 0.9rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--off-white);
      font-size: 0.88rem;
      align-items: flex-start;
    }
    .action-item:last-child { border-bottom: none; }
    .action-step {
      width: 24px; height: 24px;
      background: var(--navy);
      color: var(--white);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .action-urgent .action-step { background: var(--danger); }
    .action-text { line-height: 1.5; }
    .action-text strong { color: var(--navy); display: block; margin-bottom: 0.1rem; }

    /* ── EVIDENCE CHECKLIST ─────────────────────────────────────────── */
    .checklist { list-style: none; }
    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--off-white);
      font-size: 0.87rem;
    }
    .checklist-item:last-child { border-bottom: none; }
    .checklist-check {
      width: 20px; height: 20px;
      border: 2px solid var(--muted);
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      margin-top: 1px;
    }
    .checklist-check.checked {
      background: var(--success);
      border-color: var(--success);
      color: white;
      font-size: 0.65rem;
    }

    /* ── LETTER PREVIEW ─────────────────────────────────────────────── */
    .letter-preview {
      background: var(--white);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .letter-toolbar {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .letter-toolbar-title {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--amber);
      margin-right: auto;
    }
    .letter-body {
      font-family: Georgia, serif;
      font-size: 0.88rem;
      line-height: 1.8;
      color: var(--text-body);
      white-space: pre-wrap;
      background: var(--off-white);
      border-radius: 8px;
      padding: 1.5rem;
      border-left: 3px solid var(--amber);
      max-height: 400px;
      overflow-y: auto;
    }

    /* ── AI GENERATION ──────────────────────────────────────────────── */
    .ai-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: var(--slate);
      padding: 0.6rem 1rem;
      background: var(--off-white);
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .ai-spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--muted);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── STRIPE PLACEHOLDER ─────────────────────────────────────────── */
    .stripe-section {
      background: linear-gradient(135deg, #1a1040 0%, #2d1b69 100%);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      color: var(--white);
      margin-top: 2rem;
    }
    .stripe-badge {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 0.25rem 0.8rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 0.8rem;
    }
    .stripe-section h3 { font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 0.4rem; }
    .stripe-section p { font-size: 0.85rem; color: rgba(255,255,255,0.65); margin-bottom: 1.5rem; }
    .stripe-features {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .stripe-feature { font-size: 0.8rem; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 0.3rem; }

    /* ── FOOTER ─────────────────────────────────────────────────────── */
    .footer {
      background: var(--navy);
      color: var(--slate-lt);
      text-align: center;
      padding: 2rem 1.5rem;
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .footer strong { color: var(--muted); }

    /* ── TAGS / PILLS ───────────────────────────────────────────────── */
    .tag {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .tag-amber { background: rgba(232,160,32,0.15); color: #a06010; }
    .tag-danger { background: rgba(232,80,80,0.12); color: var(--danger); }
    .tag-success { background: rgba(46,204,138,0.12); color: #1a8a5a; }

    /* ── BREADCRUMB ─────────────────────────────────────────────────── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--slate);
      margin-bottom: 1.5rem;
    }
    .breadcrumb-sep { color: var(--muted); }
    .breadcrumb-link { cursor: pointer; color: var(--amber); font-weight: 500; }
    .breadcrumb-link:hover { text-decoration: underline; }

    /* ── DISCLAIMER BOX ─────────────────────────────────────────────── */
    .disclaimer {
      background: rgba(232,160,32,0.08);
      border: 1px solid rgba(232,160,32,0.3);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      font-size: 0.8rem;
      color: #6b4400;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .disclaimer strong { color: #4a2e00; }

    /* ── HOW IT WORKS (home) ────────────────────────────────────────── */
    .how-section { background: var(--white); padding: 4rem 2rem; }
    .how-inner { max-width: 800px; margin: 0 auto; }
    .how-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--navy);
      text-align: center;
      margin-bottom: 0.3rem;
    }
    .how-sub { text-align: center; color: var(--slate); font-size: 0.9rem; margin-bottom: 2.5rem; }
    .how-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
    }
    .how-step { text-align: center; }
    .how-num {
      width: 44px; height: 44px;
      background: var(--navy);
      color: var(--amber);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 auto 0.8rem;
    }
    .how-step h4 { font-size: 0.95rem; color: var(--navy); margin-bottom: 0.3rem; font-weight: 600; }

      'Evidence of vulnerability (medical letters, benefit award letters)',
      'Log of bailiff visits (dates, times, what happened)',
      'Evidence of any goods removed',
      'Photographs of any damage caused during entry',
      'Proof of payments already made',
    ],
    letterType: 'bailiff_complaint',
  },

  // ── NEIGHBOUR ────────────────────────────────────────────────────────
  noise: {
    title: 'Noise Nuisance',
    rights: `Excessive noise from neighbours can constitute a <strong>statutory nuisance</strong> under the <strong>Environmental Protection Act 1990</strong>. Your local council's Environmental Health team has powers to investigate and serve an <strong>Abatement Notice</strong> on the person causing the noise.\n\nBreaching an Abatement Notice is a criminal offence carrying a fine of up to <strong>£5,000</strong> for domestic premises.\n\nUnder the <strong>Noise Act 1996</strong>, councils have additional powers to deal with excessive noise from dwellings at night (11pm–7am).\n\nIf you are a tenant, your landlord may also have obligations to deal with noise caused by other tenants in the same building. Persistent noise nuisance can entitle a tenant to a rent reduction.\n\nAs a last resort, you can bring a <strong>private nuisance claim</strong> in the county court for damages and an injunction, but this is expensive and should follow all other avenues.`,
    urgency: 'medium',
    actions: [
      { title: 'Keep a detailed noise diary', detail: 'Record every incident — date, time, duration, type of noise, and how it affected you. This is essential evidence for council action or court proceedings.', urgent: false },
      { title: 'Speak to your neighbour (if safe to do so)', detail: 'A polite conversation or note often resolves noise issues without escalation. Your neighbour may not realise the impact.', urgent: false },
      { title: 'Report to Environmental Health', detail: 'Contact your local council\'s Environmental Health team. They can investigate, install noise monitoring equipment, and serve an Abatement Notice. This is free.', urgent: false },
      { title: 'Try mediation', detail: 'Community mediation services (often free through your council) can resolve neighbour disputes without legal action. Many councils offer this as a first step.', urgent: false },
      { title: 'Apply for an injunction as a last resort', detail: 'If all else fails, you can apply to the county court for an injunction to stop the noise. Seek legal advice first — this involves costs.', urgent: false },
    ],
    evidence: [
      'Noise diary (dates, times, duration, type, impact on you)',
      'Audio or video recordings of the noise',
      'Witness statements from other neighbours affected',
      'Any previous communication with the neighbour about the issue',
      'Council noise monitoring reports if applicable',
      'Medical evidence if health has been affected (e.g. sleep deprivation)',
      'Correspondence with your landlord if relevant',
    ],
    letterType: 'noise_complaint',
  },

  boundary: {
    title: 'Boundary Dispute',
    rights: `Boundary disputes are governed by general property law and the documents registered with <strong>HM Land Registry</strong>. The definitive boundary is determined by your <strong>title deeds</strong> and the Land Registry title plan, though these often show only general boundaries.\n\nKey principles:\n• The <strong>Land Registration Act 2002</strong> governs registered land — you can apply to HM Land Registry to determine a boundary precisely\n• <strong>Adverse possession</strong> (squatter's rights) may apply if someone has occupied land for 10+ years (registered land) or 12+ years (unregistered land) — this cuts both ways\n• Overhanging branches can be cut back to the boundary (but must be offered back to the neighbour)\n• Roots causing damage may give rise to a <strong>nuisance claim</strong>\n• Always check your deeds, any conveyance plans, and local Land Registry documents before taking action`,
    urgency: 'low',
    actions: [
      { title: 'Get copies of your title deeds', detail: 'Download your title register and title plan from HM Land Registry (landregistry.gov.uk) for £3 each. Also request your neighbour\'s title plan to compare boundaries.', urgent: false },
      { title: 'Write to your neighbour formally', detail: 'If informal discussion has failed, write a formal letter setting out your position with reference to the title deeds. Keep it factual and professional.', urgent: false },
      { title: 'Instruct a boundary surveyor', detail: 'A chartered boundary surveyor can produce an expert report on where the legal boundary lies. This is useful evidence for any legal proceedings.', urgent: false },
      { title: 'Try mediation', detail: 'The Royal Institution of Chartered Surveyors (RICS) and local mediation services can help resolve boundary disputes without court action, which is far cheaper.', urgent: false },
      { title: 'Apply to HM Land Registry for a determined boundary', detail: 'Under the Land Registration Act 2002, you can apply to fix the exact boundary on the register. This is not a quick process but provides a definitive answer.', urgent: false },
    ],
    evidence: [
      'Your title register and title plan from Land Registry',
      'Original conveyance or transfer deeds if available',
      'Historic photographs showing the boundary position',
      'Any planning permissions for fences or structures',
      'Correspondence with your neighbour about the dispute',
      'Surveyor\'s report if obtained',
      'Witness statements from long-standing neighbours',
      'Photographs showing current boundary position',
    ],
    letterType: 'boundary_dispute',
  },

  // ── SMALL CLAIMS ─────────────────────────────────────────────────────
  small_claims: {
    title: 'Small Claims Court',
    rights: `The <strong>small claims track</strong> in the county court handles most civil disputes up to <strong>£10,000</strong> in England and Wales (£5,000 in Scotland's Simple Procedure). It is designed to be used without a solicitor.\n\nKey features:\n• Court fees are proportional to your claim amount (from £35 for claims under £300)\n• Legal costs are generally not recoverable in small claims, so each party bears their own costs\n• You must send a <strong>Letter Before Action (LBA)</strong> before issuing a claim — courts expect this\n• The defendant has <strong>14 days</strong> to respond to your claim once issued\n• If they do not respond, you can apply for a <strong>default judgment</strong>\n• Claims are submitted online at <strong>gov.uk/make-court-claim-for-money</strong> (Money Claim Online / MCOL)\n\nFor personal injury claims, the limit is £1,500. For housing disrepair, it is £1,000.`,
    urgency: 'medium',
    actions: [
      { title: 'Send a formal Letter Before Action (LBA)', detail: 'This is required before issuing a claim. Give the defendant 14 days to respond. State the amount you are claiming, the reason, and that you will issue court proceedings if they do not pay.', urgent: false },
      { title: 'Gather all your evidence', detail: 'Collect contracts, invoices, photographs, correspondence, and any witness statements. The stronger your evidence pack, the more likely the defendant will settle before a hearing.', urgent: false },
      { title: 'Submit your claim online', detail: 'Go to gov.uk/make-court-claim-for-money. You will need the defendant\'s full name and address, the amount claimed, and a brief description of why you are claiming.', urgent: false },
      { title: 'Consider mediation', detail: 'The court will likely suggest free mediation before a hearing. Many cases settle through mediation — it is faster and less stressful than a court hearing.', urgent: false },
      { title: 'Prepare for the hearing', detail: 'If the case goes to a hearing, organise your documents in date order, prepare a clear summary of your case, and bring three copies of everything (judge, defendant, yourself).', urgent: false },
    ],
    evidence: [
      'Your Letter Before Action and proof of delivery',
      'The defendant\'s response (or evidence of no response)',
      'Contract, agreement, or invoice',
      'Proof of payment made',
      'Photographs or other evidence of the problem',
      'Any correspondence between you and the defendant',
      'Independent quotes or assessments if relevant',
      'Witness statements',
    ],
    letterType: 'letter_before_action',
  },

  // ── BENEFITS ─────────────────────────────────────────────────────────
  uc_dispute: {
    title: 'Universal Credit Dispute',
    rights: `If you disagree with a Universal Credit decision, you have the right to challenge it through a formal process:\n\n<strong>Step 1 — Mandatory Reconsideration (MR)</strong>: You must request an MR within <strong>1 month</strong> of the decision. The DWP must look at the decision again. Request this in writing through your UC journal or by calling the UC helpline (0800 328 5644).\n\n<strong>Step 2 — Appeal to Tribunal</strong>: If the MR confirms the original decision, you have <strong>1 month from the MR notice</strong> to appeal to the Social Security and Child Support Tribunal (SSCS Tribunal). Appeals are free and heard by an independent panel.\n\nFor <strong>sanctions</strong>, the DWP must show your behaviour was not reasonable. Many sanctions are overturned on appeal.\n\nFor <strong>overpayment recovery</strong>, you can challenge whether the overpayment was caused by official error and request a waiver.`,
    urgency: 'medium',
    actions: [
      { title: 'Request a Mandatory Reconsideration within 1 month', detail: 'Write in your UC journal or call 0800 328 5644 to request an MR. Explain clearly why you think the decision is wrong and include any supporting evidence.', urgent: true },
      { title: 'Get a written MR decision notice', detail: 'Make sure you receive the MR decision in writing — you need this to appeal to tribunal. If you only get a journal message, ask for a formal written notice.', urgent: false },
      { title: 'Appeal to SSCS Tribunal within 1 month of MR decision', detail: 'Use form SSCS1 (available at gov.uk) or appeal online. Appeals are free. You can request a paper hearing, telephone, or face-to-face hearing.', urgent: false },
      { title: 'Get help from Citizens Advice', detail: 'Citizens Advice (0800 144 8848) provide free, specialist benefits advice and can help you write your MR request and appeal. Many areas have specialist welfare rights advisers.', urgent: false },
      { title: 'Request advance payment if you are in hardship', detail: 'If you are waiting for a UC decision and have no money, you can request a Hardship Payment or Budgeting Advance through your UC journal.', urgent: false },
    ],
    evidence: [
      'The DWP decision letter or journal message',
      'Your Mandatory Reconsideration request (keep a copy)',
      'MR decision notice from DWP',
      'Any medical evidence or fit notes',
      'Evidence of job searching or work-related activity if sanctions are involved',
      'Bank statements showing financial hardship',
      'Any previous UC correspondence',
      'SSCS1 appeal form once completed',
    ],
    letterType: 'uc_mandatory_reconsideration',
  },

  benefits_appeal: {
    title: 'Benefits Appeal',
    rights: `You have the right to appeal most DWP benefit decisions to an independent <strong>Social Security and Child Support (SSCS) Tribunal</strong>.\n\nThe appeal process:\n1. <strong>Mandatory Reconsideration</strong> — must be completed first (within 1 month of the original decision)\n2. <strong>Tribunal appeal</strong> — must be submitted within 1 month of the MR decision (using form SSCS1)\n3. <strong>Upper Tribunal</strong> — if a point of law was wrongly decided at the first tribunal\n\nTribunals are independent of the DWP and overturn a significant proportion of appeals — for PIP, around <strong>60–70% of appeals that reach a hearing are successful</strong>.\n\nYou can be represented at tribunal by a welfare rights adviser, Citizens Advice worker, or solicitor. You do not need a lawyer but specialist support significantly improves success rates.`,
    urgency: 'medium',
    actions: [
      { title: 'Complete the Mandatory Reconsideration first if not done', detail: 'You cannot appeal to tribunal without an MR decision. Request this within 1 month of the original decision by contacting the benefit office in writing.', urgent: true },
      { title: 'Submit your tribunal appeal within 1 month of the MR decision', detail: 'Use form SSCS1 (download from gov.uk/appeal-benefit-decision). Send it to HMCTS. Appeals are free. Late appeals can be accepted with good reason.', urgent: true },
      { title: 'Gather strong supporting evidence', detail: 'Medical evidence (letters from GPs, consultants, care workers) is crucial, especially for PIP and ESA appeals. Ask your GP for a letter specifically addressing your functional ability.', urgent: false },
      { title: 'Consider requesting an oral hearing', detail: 'You have a much higher success rate at an in-person or telephone hearing than a paper hearing. Request an oral hearing when submitting your appeal form.', urgent: false },
      { title: 'Get specialist support for your hearing', detail: 'Contact Citizens Advice (0800 144 8848), your local welfare rights service, or a disability charity for help preparing your case. Representation at tribunal dramatically improves outcomes.', urgent: false },
    ],
    evidence: [
      'Original benefit decision letter',
      'Mandatory Reconsideration request and MR decision notice',
      'SSCS1 appeal form',
      'Medical evidence: GP letters, consultant reports, care plans',
      'Personal statement describing how your condition affects daily life',
      'Witness statements from carers or family members',
      'Any previous assessments or reports from the DWP',
      'Diary of how your condition varies day to day',
    ],
    letterType: 'benefits_appeal_letter',
  },

  // ── FAMILY ───────────────────────────────────────────────────────────
  child_contact: {
    title: 'Child Contact Dispute',
    rights: `Under the <strong>Children Act 1989</strong>, the welfare of the child is the court's paramount consideration. Both parents generally have the right to maintain a relationship with their child, and courts presume that involvement of both parents is in the child's best interests unless there is evidence of risk.\n\n<strong>Child Arrangements Orders</strong> (formerly residence and contact orders) are made under Section 8 of the Children Act 1989 and set out where a child lives and the time they spend with each parent.\n\nBefore applying to court, you must usually attend a <strong>Mediation Information and Assessment Meeting (MIAM)</strong> — exemptions apply in cases involving domestic abuse, child protection concerns, or where the other party refuses to engage.\n\nBreaching a Child Arrangements Order without good reason can result in enforcement proceedings, including unpaid work requirements or committal to prison in serious cases.\n\nThe <strong>Child Maintenance Service (CMS)</strong> handles financial support separately from contact arrangements.`,
    urgency: 'medium',
    actions: [
      { title: 'Prioritise the child\'s safety above all else', detail: 'If you believe the child is at immediate risk of harm, contact the police (999) or social services immediately. Do not delay in the interests of avoiding conflict.', urgent: true },
      { title: 'Attend a MIAM (Mediation Information and Assessment Meeting)', detail: 'This is required before most court applications. A mediator will assess whether mediation is suitable. Contact a family mediator through familymediationcouncil.org.uk.', urgent: false },
      { title: 'Try to agree arrangements in writing', detail: 'A written co-parenting agreement, while not legally binding, sets clear expectations and demonstrates good faith if you later need to go to court.', urgent: false },
      { title: 'Apply for a Child Arrangements Order if necessary', detail: 'Use Form C100 (available at gov.uk) to apply to the family court. The application fee is £232. Many people do this without a solicitor using the guidance at cafcass.gov.uk.', urgent: false },
      { title: 'Contact CAFCASS for guidance', detail: 'The Children and Family Court Advisory and Support Service (CAFCASS) supports children and families involved in family court. Visit cafcass.gov.uk or call 0300 456 4000.', urgent: false },
    ],
    evidence: [
      'Any existing court orders relating to the child',
      'Written records of agreed contact arrangements',
      'Log of missed or refused contact (dates and circumstances)',
      'Any communications from the other parent about contact',
      'Evidence of the child\'s wishes (if age-appropriate)',
      'School or medical records showing your involvement',
      'Evidence of domestic abuse or safeguarding concerns if applicable',
      'MIAM attendance certificate',
    ],
    letterType: 'child_contact_letter',
  },

  coparenting: {
    title: 'Co-parenting Agreement',
    rights: `Co-parenting agreements are not legally binding in England and Wales unless made into a court order, but they provide a clear written framework that both parents can refer to and that courts will consider if disputes arise.\n\nKey areas typically covered include:\n• <strong>Contact schedule</strong> — regular weekly arrangements and holiday splits\n• <strong>Education decisions</strong> — school choice, parents' evenings, school trips\n• <strong>Medical decisions</strong> — consent for treatment, GP registration\n• <strong>Communication</strong> — how parents communicate about the child, response times\n• <strong>Financial arrangements</strong> — maintenance (handled by CMS), school costs, activities\n\nUnder the <strong>Children Act 1989</strong>, both parents with parental responsibility have equal rights to make decisions about the child's upbringing. A co-parenting agreement works best when both parties commit to it voluntarily.\n\nIf the agreement breaks down, either parent can apply to the family court for a <strong>Child Arrangements Order</strong>.`,
    urgency: 'low',
    actions: [
      { title: 'Identify all key areas to agree on', detail: 'Before drafting anything, list all decisions that need to be made: contact schedule, holidays, school, medical, communication, and finances. Work through each systematically.', urgent: false },
      { title: 'Consider using a family mediator', detail: 'A mediator can help you both reach agreement on disputed areas in a neutral setting. This is far cheaper than court and produces more durable agreements. Find one at familymediationcouncil.org.uk.', urgent: false },
      { title: 'Put the agreement in writing', detail: 'Once agreed, put the full arrangement in writing and have both parents sign it. Keep copies. While not legally binding, it provides a clear reference point.', urgent: false },
      { title: 'Consider making it a court order', detail: 'You can apply to the family court for a "consent order" which turns your agreement into a legally enforceable court order. This provides greater security for both parties.', urgent: false },
      { title: 'Review the agreement regularly', detail: 'Children\'s needs change. Build in a review process — for example, every 6 or 12 months — so the agreement evolves as your child grows.', urgent: false },
    ],
    evidence: [
      'Any previous written agreements between parents',
      'Existing court orders if applicable',
      'School information (term dates, holidays)',
      'Record of current contact arrangements',
      'Any mediation notes or memorandum of understanding',
    ],
    letterType: 'coparenting_agreement',
  },

  ex_harassment: {
    title: 'Harassment from Ex-Partner',
    rights: `Harassment by an ex-partner is a serious matter covered by multiple laws:\n\n<strong>Protection from Harassment Act 1997</strong>: It is a criminal offence to pursue a course of conduct (two or more incidents) that causes another person to fear violence or that amounts to harassment. This carries up to 10 years imprisonment.\n\n<strong>Stalking</strong> (Section 2A and 4A, Protection from Harassment Act 1997): Specific stalking offences were introduced in 2012 and carry up to 10 years imprisonment.\n\n<strong>Non-Molestation Orders</strong> (Family Law Act 1996): Available from the family court, these legally prohibit the abusive person from contacting you or coming near you. Breach is a criminal offence carrying up to 5 years imprisonment.\n\n<strong>Domestic abuse</strong> (Domestic Abuse Act 2021): Covers psychological, emotional, and coercive control as well as physical abuse between intimate partners and family members.\n\nYou can apply for a non-molestation order without the other person knowing (without notice) in urgent cases.`,
    urgency: 'high',
    actions: [
      { title: 'Contact the police if you feel unsafe', detail: 'Call 999 in an emergency or 101 for non-emergency reports. Harassment and stalking by an ex-partner are criminal offences. Always get a crime reference number.', urgent: true },
      { title: 'Apply for a Non-Molestation Order', detail: 'This is a court order prohibiting the person from contacting or approaching you. Apply using Form FL401 at your local family court. You do not need a solicitor. In urgent cases, the court can grant it the same day without notifying the other person.', urgent: true },
      { title: 'Contact the National Domestic Abuse Helpline', detail: 'Call 0808 2000 247 (free, 24/7) or visit nationaldahelpline.org.uk. They can provide immediate support and help you access specialist services including legal advice.', urgent: false },
      { title: 'Block all contact channels and document everything', detail: 'Block on all platforms, but before blocking, screenshot and save all messages, calls, and social media activity. This evidence is crucial for police and court applications.', urgent: false },
      { title: 'Inform trusted people', detail: 'Tell your employer, school, or trusted neighbours so they can help keep you safe and be witnesses if the person approaches those locations.', urgent: false },
    ],
    evidence: [
      'Log of all incidents (dates, times, what happened)',
      'Screenshots of all messages, social media contact, and emails',
      'Call logs showing repeated contact attempts',
      'Photographs of any damage to property or physical injuries',
      'Witness statements from those who have seen the harassment',
      'Police crime reference number(s)',
      'Any previous court orders (non-molestation, occupation order)',
      'Medical records if physical or psychological harm has occurred',
    ],
    letterType: 'ex_harassment_warning',
  },

  separation_letter: {
    title: 'Separation Communication Letter',
    rights: `When a relationship ends, written communication can help establish clear boundaries, confirm arrangements, and create a record of what has been agreed. While separation letters are not legal documents in themselves, they:\n\n• Provide a written record of communications which can be used as evidence if disputes arise\n• Help establish clear boundaries around contact, especially where there is a risk of harassment\n• Confirm agreed arrangements for children, property, or finances\n• Can form the basis of a formal legal agreement if reviewed by a solicitor\n\nIf you are married or in a civil partnership, formal separation has legal implications for finances and property under the <strong>Matrimonial Causes Act 1973</strong>. A formal separation agreement or divorce petition may be needed for financial matters to be legally binding.\n\nFor cohabiting couples, the <strong>Trusts of Land and Appointment of Trustees Act 1996 (TOLATA)</strong> governs property disputes.`,
    urgency: 'low',
    actions: [
      { title: 'Be clear and factual in all written communication', detail: 'Keep letters or emails focused on practical matters. Avoid emotional language that could escalate conflict or be used against you later.', urgent: false },
      { title: 'Confirm key arrangements in writing', detail: 'Where you have agreed arrangements for children, property, or finances, confirm these in a letter or email immediately after any verbal discussion.', urgent: false },
      { title: 'Set clear communication boundaries', detail: 'If you want to limit contact to certain topics (e.g. children only) or certain channels (e.g. email only), state this clearly and consistently.', urgent: false },
      { title: 'Seek legal advice for financial matters', detail: 'If you are married, any financial settlement should be formalised through a court consent order to be legally binding. A solicitor can advise on your entitlements.', urgent: false },
      { title: 'Consider a solicitor\'s letter for serious disputes', detail: 'If communication has broken down or the other party is not cooperating, a formal letter from a solicitor carries more weight and signals you are serious about protecting your legal rights.', urgent: false },
    ],
    evidence: [
      'All previous written communications between you',
      'Any existing agreements about children, property, or finances',
      'Evidence of what has been agreed verbally (diary notes, witness accounts)',
      'Marriage certificate or civil partnership certificate if applicable',
      'Property documents if relevant',
      'Children\'s details if arrangements are being confirmed',
    ],
    letterType: 'separation_communication',
  },

  // ── MEDICAL ──────────────────────────────────────────────────────────
  gp_complaint: {
    title: 'GP Complaint',
    rights: `You have the right to make a complaint about NHS care under the <strong>NHS Constitution for England</strong>, which gives patients the right to have complaints investigated and to receive a full response.\n\nThe NHS complaints process has two stages:\n1. <strong>Local resolution</strong> — complain directly to the GP practice. They must acknowledge within 3 working days and respond fully within 40 working days.\n2. <strong>Parliamentary and Health Service Ombudsman (PHSO)</strong> — if local resolution fails, you can escalate free of charge.\n\nComplaints must generally be made within <strong>12 months</strong> of the incident. For serious concerns about a GP's fitness to practise, report to the <strong>General Medical Council (GMC)</strong> at gmc-uk.org.`,
    urgency: 'medium',
    actions: [
      { title: 'Submit a formal written complaint to the Practice Manager', detail: 'Set out what happened, when, who was involved, and what outcome you want. They must acknowledge within 3 working days and respond within 40 working days.', urgent: false },
      { title: 'Contact NHS England if the practice does not resolve it', detail: 'Escalate to NHS England at england.nhs.uk/contact-us/complaint if the practice\'s response is unsatisfactory.', urgent: false },
      { title: 'Refer to the Parliamentary and Health Service Ombudsman', detail: 'If local resolution fails, contact the PHSO at ombudsman.org.uk or 0345 015 4033. Free and independent.', urgent: false },
      { title: 'Report to the GMC for serious fitness to practise concerns', detail: 'If you have concerns about a doctor\'s conduct or competence affecting patient safety, report to gmc-uk.org/concerns.', urgent: false },
      { title: 'Seek legal advice for clinical negligence', detail: 'If negligent care caused you harm, consult a clinical negligence solicitor — many work on no-win no-fee.', urgent: false },
    ],
    evidence: [
      'Full written account of what happened (dates, times, staff names)',
      'Copies of prescriptions, referral letters, or test results',
      'Your GP records (request via Subject Access Request)',
      'Correspondence with the practice about this issue',
      'Witness details if anyone accompanied you',
      'Medical evidence of any harm caused',
      'Your complaint letter and any responses received',
    ],
    letterType: 'gp_complaint_letter',
  },

  hospital_complaint: {
    title: 'Hospital Complaint',
    rights: `Under the <strong>NHS Constitution</strong> and the <strong>Local Authority Social Services and NHS Complaints Regulations 2009</strong>, you have the right to have your complaint investigated promptly.\n\nKey rights:\n• Acknowledgement within <strong>3 working days</strong>\n• Full written response within <strong>40 working days</strong>\n• The right to escalate to the <strong>Parliamentary and Health Service Ombudsman (PHSO)</strong>\n\nSerious patient safety concerns can also be reported to the <strong>Care Quality Commission (CQC)</strong> at cqc.org.uk, which regulates all health and social care providers.\n\nFor clinical negligence claims, the limitation period is generally <strong>3 years</strong> from the date of negligence or when you first became aware of it.`,
    urgency: 'medium',
    actions: [
      { title: 'Contact PALS for informal resolution', detail: 'Every NHS hospital has a Patient Advice and Liaison Service. They can often resolve issues quickly. Find yours at nhs.uk/pals.', urgent: false },
      { title: 'Submit a formal written complaint to the hospital', detail: 'Write to the Chief Executive or Complaints Manager. Set out clearly what happened, who was involved, when, and what outcome you want.', urgent: false },
      { title: 'Request your medical records via SAR', detail: 'Submit a Subject Access Request to the medical records department. Free under GDPR, must be provided within 1 month.', urgent: false },
      { title: 'Escalate to the PHSO if not resolved', detail: 'Contact the Parliamentary and Health Service Ombudsman at ombudsman.org.uk if the hospital\'s response is unsatisfactory.', urgent: false },
      { title: 'Report safety concerns to the CQC', detail: 'The Care Quality Commission (cqc.org.uk or 03000 616161) investigates concerns about patient safety and quality of care.', urgent: false },
    ],
    evidence: [
      'Detailed written account (dates, times, ward, staff names)',
      'Hospital letters, discharge summaries, appointment letters',
      'Medical records obtained via SAR',
      'Photographs of any harm or conditions if relevant',
      'Witness statements from family or friends present',
      'Correspondence with the hospital',
      'Evidence of financial losses caused',
    ],
    letterType: 'hospital_complaint_letter',
  },

  misdiagnosis: {
    title: 'Misdiagnosis Concern',
    rights: `A misdiagnosis may constitute <strong>clinical negligence</strong> if it falls below the standard of a reasonably competent medical professional and causes harm.\n\nTo succeed in a clinical negligence claim you must prove:\n1. <strong>Duty of care</strong> — owed by the healthcare provider (almost always established)\n2. <strong>Breach</strong> — care fell below the standard of a reasonable body of medical opinion (<em>Bolam test</em>)\n3. <strong>Causation</strong> — the breach caused harm that would not otherwise have occurred\n\nThe limitation period is generally <strong>3 years</strong> from the date of negligence or from when you first had knowledge of it.\n\nBefore pursuing a legal claim you have the right to a full explanation through the <strong>NHS complaints process</strong>, access to your medical records (free under UK GDPR), and a second medical opinion.`,
    urgency: 'high',
    actions: [
      { title: 'Obtain a second medical opinion', detail: 'Ask your GP for a specialist referral or seek a private second opinion. This confirms whether a misdiagnosis occurred and establishes your correct diagnosis.', urgent: true },
      { title: 'Request your full medical records via SAR', detail: 'Submit a Subject Access Request to every relevant provider. Free under UK GDPR, must be provided within 1 month. These are the foundation of any complaint or claim.', urgent: false },
      { title: 'Submit a formal NHS complaint', detail: 'Complain in writing asking for a full explanation of the clinical decisions made. This does not affect your right to bring a legal claim later.', urgent: false },
      { title: 'Contact a clinical negligence solicitor', detail: 'If you have suffered harm, consult a specialist solicitor. Many offer free initial consultations and work on no-win no-fee. Find one at apil.org.uk.', urgent: false },
      { title: 'Report to the GMC if conduct was seriously below standard', detail: 'The General Medical Council (gmc-uk.org) investigates concerns about doctors\' fitness to practise where patient safety is at risk.', urgent: false },
    ],
    evidence: [
      'Medical records from all relevant providers',
      'Written account of symptoms reported and when',
      'Records of all appointments (dates, diagnosis given)',
      'The correct diagnosis and when it was eventually made',
      'Second medical opinion confirming misdiagnosis',
      'Evidence of harm caused (worsened condition, further treatment)',
      'Financial losses (time off work, private treatment costs)',
    ],
    letterType: 'misdiagnosis_complaint',
  },

  medical_records: {
    title: 'Access to Medical Records (SAR)',
    rights: `Under <strong>UK GDPR Article 15</strong> and the <strong>Data Protection Act 2018</strong>, you have the right to access personal data held about you — including medical records — through a <strong>Subject Access Request (SAR)</strong>.\n\nKey rights:\n• Records must be provided <strong>free of charge</strong>\n• The organisation must respond within <strong>1 calendar month</strong>\n• You do not have to give a reason for your request\n• The period can be extended by 2 months for complex requests, but you must be informed\n\nIf access is refused or records are incomplete, you can complain to the <strong>Information Commissioner's Office (ICO)</strong> at ico.org.uk, which has powers to require organisations to comply.`,
    urgency: 'low',
    actions: [
      { title: 'Submit a formal Subject Access Request in writing', detail: 'Write to the Data Controller (Practice Manager for GPs; medical records department for hospitals) citing UK GDPR Article 15. Specify the records and time period you want.', urgent: false },
      { title: 'Include proof of identity', detail: 'Provide photo ID and proof of address. The organisation may request these before releasing records.', urgent: false },
      { title: 'Chase if no response within 1 month', detail: 'If no response within 1 calendar month, send a formal chase giving 14 days before escalating to the ICO.', urgent: false },
      { title: 'Complain to the ICO if refused or ignored', detail: 'The Information Commissioner\'s Office (ico.org.uk or 0303 123 1113) can investigate and require organisations to comply. Complaints are free.', urgent: false },
      { title: 'Seek legal advice if records are needed for a claim', detail: 'If you need records for a negligence claim, a solicitor can request them and take steps to obtain them more quickly if necessary.', urgent: false },
    ],
    evidence: [
      'Your Subject Access Request letter and proof of postage or email delivery',
      'Proof of identity provided with your request',
      'Acknowledgement received from the organisation (if any)',
      'The response received — or evidence of no response',
    ],
    letterType: 'medical_sar_letter',
  },

  // ── EDUCATION ────────────────────────────────────────────────────────
  school_bullying: {
    title: 'Bullying Incident Report',
    rights: `All schools in England have a legal duty under the <strong>Education Act 2002 (Section 175)</strong> to safeguard and promote the welfare of pupils. Schools must have an <strong>anti-bullying policy</strong> and must act on reports of bullying.\n\nWhere bullying is based on a protected characteristic (race, disability, religion, sexual orientation, gender reassignment), it may also constitute unlawful discrimination under the <strong>Equality Act 2010</strong>, and the school has a duty to take action under the Public Sector Equality Duty.\n\n<strong>Cyberbullying</strong> that occurs outside school can still be addressed by the school if it affects the school environment or involves pupils.\n\nIf the school fails to act, you can:\n• Complain to the school governors\n• Refer to the local authority\n• Complain to the Department for Education (for academies/free schools, also to the Regional Director)\n• In serious cases involving criminal behaviour, report to the police`,
    urgency: 'high',
    actions: [
      { title: 'Report in writing to the class teacher or form tutor immediately', detail: 'Put all reports in writing — email is ideal. Describe each incident with dates, times, who was involved, and any witnesses. This creates a paper trail.', urgent: true },
      { title: 'Request a meeting with the headteacher if not resolved', detail: 'If initial reports are not acted on, write formally to the headteacher. Reference the school\'s anti-bullying policy (available on the school website) and ask what action will be taken.', urgent: false },
      { title: 'Document all incidents in detail', detail: 'Keep a written log of every bullying incident, including dates, times, descriptions, and your child\'s account. Screenshot and preserve any online bullying evidence immediately.', urgent: false },
      { title: 'Contact the governing body if the school does not act', detail: 'Write to the chair of governors. Governing bodies have oversight of school policies and can require the headteacher to account for how policies are being implemented.', urgent: false },
      { title: 'Report to police if criminal behaviour is involved', detail: 'Serious physical assaults, threats, hate crimes, or the sharing of intimate images without consent are criminal offences. Report to police (101) and obtain a crime reference number.', urgent: false },
    ],
    evidence: [
      'Written log of all incidents (dates, times, what happened, witnesses)',
      'Screenshots of cyberbullying (messages, posts, images)',
      'Medical records or GP notes if physical or psychological harm resulted',
      'Your child\'s written or recorded account',
      'Witness statements from other pupils or parents (with consent)',
      'Copies of all correspondence with the school',
      'The school\'s anti-bullying policy',
      'Any previous reports made to the school and their response',
    ],
    letterType: 'bullying_report_letter',
  },

  headteacher_complaint: {
    title: 'Complaint to Headteacher',
    rights: `All maintained schools and academies in England must have a formal <strong>complaints procedure</strong> that is accessible to parents and published on the school website, under the <strong>Education Act 2002</strong> and the <strong>School Complaints Procedures Regulations</strong>.\n\nA typical school complaints procedure has three stages:\n1. <strong>Informal stage</strong> — raise with the relevant teacher or head of year\n2. <strong>Formal stage</strong> — written complaint to the headteacher, who must respond within a set timescale (usually 10–20 school days)\n3. <strong>Appeal stage</strong> — review by a governing body complaints panel\n\nFor academies and free schools, if the governors' stage fails, you can also refer to the <strong>Regional Director</strong> (formerly Regional Schools Commissioner) or the <strong>Education and Skills Funding Agency (ESFA)</strong>.\n\nFor maintained schools, the final escalation point is the <strong>local authority</strong> and ultimately the <strong>Department for Education (DfE)</strong> School Complaints Unit.`,
    urgency: 'medium',
    actions: [
      { title: 'Review the school\'s complaints procedure', detail: 'Download it from the school website. This sets out the exact steps and timescales you must follow. Following the procedure strengthens your position at every stage.', urgent: false },
      { title: 'Submit a formal written complaint to the headteacher', detail: 'Write clearly setting out what happened, when, who was involved, what you have already raised, and what outcome you are seeking. Give the school the opportunity to respond.', urgent: false },
      { title: 'Request a meeting with the headteacher', detail: 'A face-to-face or virtual meeting can resolve issues more quickly than correspondence. Ask for a meeting and take notes of everything discussed.', urgent: false },
      { title: 'Escalate to the governing body if not resolved', detail: 'If the headteacher\'s response is unsatisfactory, write to the chair of governors requesting a formal complaints panel hearing. This is your right under the school\'s complaints procedure.', urgent: false },
      { title: 'Refer to the DfE School Complaints Unit as a last resort', detail: 'If all school-level processes have been exhausted, the DfE School Complaints Unit (for maintained schools) or Regional Director (for academies) can consider whether the correct procedure was followed.', urgent: false },
    ],
    evidence: [
      'The school\'s published complaints procedure',
      'All previous correspondence with the school about this matter',
      'Notes of any meetings or phone calls (with dates)',
      'Your child\'s account of events (written)',
      'Witness statements if relevant',
      'Any relevant school policies (behaviour policy, safeguarding policy etc.)',
      'Evidence of the issue complained about (emails, photographs, etc.)',
    ],
    letterType: 'headteacher_complaint_letter',
  },

  sen_support: {
    title: 'SEN Support Request',
    rights: `Under the <strong>Children and Families Act 2014</strong> and the <strong>SEND Code of Practice 2015</strong>, children and young people with special educational needs and disabilities (SEND) have the right to appropriate support.\n\nKey rights:\n• Schools must use their <strong>best endeavours</strong> to meet a child's SEN needs (Section 66, Children and Families Act 2014)\n• Parents can request a <strong>statutory EHC needs assessment</strong> from the local authority at any time\n• The local authority must decide within <strong>6 weeks</strong> whether to carry out an assessment\n• If an EHC Plan is issued, the provision specified in it is <strong>legally binding</strong> — the school and local authority must provide it\n• You have the right to request a <strong>Personal Budget</strong> to arrange some of the support yourself\n• Disputes can be referred to the <strong>SEND Tribunal</strong> (free) for independent resolution\n\nContact <strong>IPSEA (ipsea.org.uk)</strong> or <strong>SOS!SEN (sossen.org.uk)</strong> for specialist free advice.`,
    urgency: 'medium',
    actions: [
      { title: 'Request a statutory EHC needs assessment in writing', detail: 'Write to your local authority\'s SEND team requesting a statutory EHC needs assessment. You do not need the school\'s agreement — you can request this directly. The LA must respond within 6 weeks.', urgent: false },
      { title: 'Gather evidence of your child\'s needs', detail: 'Collect school reports, teacher assessments, medical diagnoses, CAMHS letters, and any private assessments. The stronger the evidence, the more likely an assessment will be agreed.', urgent: false },
      { title: 'Engage with the school\'s SENCO', detail: 'The Special Educational Needs Coordinator (SENCO) coordinates SEN support. Request a meeting to discuss what support is currently in place and what the school is doing to meet your child\'s needs.', urgent: false },
      { title: 'Appeal to the SEND Tribunal if assessment or plan is refused', detail: 'If the LA refuses to assess, refuses to issue an EHC Plan, or you disagree with the plan\'s contents, you can appeal to the First-Tier Tribunal (SEND) free of charge. Deadlines are strict — 2 months from the decision.', urgent: false },
      { title: 'Contact IPSEA for free legal advice', detail: 'Independent Provider of Special Education Advice (ipsea.org.uk or 0300 018 1573) provides free, legally-based advice and can help you challenge decisions by schools and local authorities.', urgent: false },
    ],
    evidence: [
      'School reports and teacher assessments',
      'Educational psychologist report if available',
      'Medical diagnoses and consultant letters',
      'CAMHS or mental health assessments',
      'Any existing EHC Plan or SEN support plans',
      'Records of communication with school and local authority',
      'Your child\'s own views (age-appropriate)',
      'Evidence of impact on learning and wellbeing',
    ],
    letterType: 'sen_request_letter',
  },

  exclusion_appeal: {
    title: 'Exclusion Appeal',
    rights: `Schools in England must follow the statutory guidance <strong>"Suspension and Permanent Exclusion from maintained schools, academies and pupil referral units" (DfE, 2023)</strong>.\n\nFor <strong>permanent exclusions</strong>:\n• Parents must be informed in writing on the day of exclusion\n• Parents have the right to make representations to the <strong>governing body</strong>, which must review the exclusion\n• If the governing body upholds the exclusion, parents can request an independent review by an <strong>Independent Review Panel (IRP)</strong>\n• The IRP can uphold, recommend reconsideration, or quash the exclusion\n\nFor <strong>fixed-term (suspension)</strong>:\n• Parents can make representations to the governing body for suspensions of more than 15 days in a term\n\nGrounds for challenging an exclusion include:\n• Failure to follow correct procedure\n• Disproportionate response\n• SEND or disability not taken into account\n• Discriminatory treatment (Equality Act 2010)\n• Evidence not properly considered`,
    urgency: 'high',
    actions: [
      { title: 'Request the exclusion in writing immediately', detail: 'The school must provide written notice of the exclusion on the day it is imposed, with reasons. If this was not provided, request it urgently in writing.', urgent: true },
      { title: 'Submit representations to the governing body', detail: 'Write to the chair of governors formally requesting a governing body review meeting. Set out the grounds for challenging the exclusion and include all supporting evidence. Deadlines are strict — usually 15 school days from the exclusion.', urgent: true },
      { title: 'Gather all relevant evidence', detail: 'Collect the school\'s account of events, your child\'s account, any witness statements, the school\'s behaviour policy, and any SEND documentation. Challenge any factual inaccuracies in the school\'s account.', urgent: false },
      { title: 'Request an Independent Review Panel if governors uphold exclusion', detail: 'If the governing body upholds a permanent exclusion, you have 15 school days to request an Independent Review Panel. Request this in writing to the clerk of governors.', urgent: false },
      { title: 'Seek specialist advice from IPSEA or a solicitor', detail: 'For permanent exclusions, consider contacting IPSEA (if SEND is involved) or an education law solicitor. Many exclusions are overturned on appeal when properly challenged.', urgent: false },
    ],
    evidence: [
      'The school\'s written exclusion notice (must be given on the day)',
      'Your child\'s full account of events in writing',
      'Witness statements from other pupils if available',
      'The school\'s behaviour and exclusion policy',
      'Your child\'s EHC Plan or SEN support records if relevant',
      'Any medical or CAMHS evidence relevant to the behaviour',
      'Records of previous behaviour incidents and how they were handled',
      'Evidence of any discriminatory treatment',
    ],
    letterType: 'exclusion_appeal_letter',
  },

  // ── TRAVEL ───────────────────────────────────────────────────────────
  flight_delay: {
    title: 'Flight Delay Compensation',
    rights: `Following Brexit, the UK retained equivalent protections to EU Regulation 261/2004 under <strong>UK Regulation 261/2004 (UK261)</strong>.\n\nYou are entitled to compensation if:\n• Your flight <strong>departed from a UK airport</strong> (any airline), OR\n• Your flight <strong>arrived in the UK on a UK or EU carrier</strong>\n\nCompensation amounts:\n• <strong>£220</strong> for flights under 1,500km delayed 3+ hours\n• <strong>£350</strong> for flights 1,500–3,500km delayed 3+ hours\n• <strong>£520</strong> for flights over 3,500km delayed 4+ hours\n\nFor <strong>cancellations</strong> with less than 14 days' notice, you are entitled to the same compensation plus a full refund or alternative flight.\n\nAirlines can avoid paying if the disruption was caused by <strong>extraordinary circumstances</strong> beyond their control (genuine severe weather, political instability, ATC strikes). Technical faults are generally <strong>not</strong> extraordinary circumstances.\n\nClaims can be made up to <strong>6 years</strong> after the flight (England/Wales).`,
    urgency: 'low',
    actions: [
      { title: 'Check your eligibility and calculate your compensation', detail: 'Use the Civil Aviation Authority checker at caa.co.uk/consumers/resolving-complaints to confirm your rights. Note the distance of your route and the exact length of the delay.', urgent: false },
      { title: 'Submit a formal claim to the airline in writing', detail: 'Email the airline\'s customer relations team citing UK Regulation 261/2004, stating the flight details, delay length, and the compensation amount you are claiming. Keep a copy.', urgent: false },
      { title: 'Escalate to an approved ADR scheme if refused', detail: 'If the airline rejects your claim or does not respond within 8 weeks, you can refer to an approved Alternative Dispute Resolution scheme. Most UK airlines use CEDR or Aviation ADR — check the CAA website for which scheme your airline uses.', urgent: false },
      { title: 'Refer to the CAA if ADR is unavailable', detail: 'The Civil Aviation Authority (caa.co.uk) enforces passenger rights. If the airline is not a member of an ADR scheme, you can refer your complaint to the CAA.', urgent: false },
      { title: 'Issue a small claims court claim as a last resort', detail: 'If all else fails, file a small claims claim at gov.uk/make-court-claim-for-money. Many airlines settle before the hearing. You can claim up to 6 years after the flight.', urgent: false },
    ],
    evidence: [
      'Booking confirmation and boarding passes',
      'Flight number and scheduled vs actual departure/arrival times',
      'Screenshot of flight tracker showing delay (FlightAware, FlightRadar24)',
      'Any communications from the airline about the delay/cancellation',
      'Receipts for meals, accommodation, or transfers caused by the delay',
      'Your written claim to the airline and their response',
      'Evidence of extraordinary circumstances claimed by the airline (if disputing)',
    ],
    letterType: 'flight_delay_letter',
  },

  hotel_complaint: {
    title: 'Hotel Complaint',
    rights: `Your rights when complaining about a hotel depend on how you booked:\n\n<strong>Package holidays</strong> (flights + hotel booked together): The <strong>Package Travel and Linked Travel Arrangements Regulations 2018</strong> give strong protections. The organiser is responsible for all elements of the package. You are entitled to a price reduction for any period of non-conformity, and compensation for damage caused.\n\n<strong>Direct hotel bookings</strong>: Governed by the <strong>Consumer Rights Act 2015</strong> — the service must be provided with reasonable care and skill and match its description. If it does not, you are entitled to a repeat performance or a price reduction.\n\n<strong>Online Travel Agency bookings</strong> (Booking.com, Expedia): Your contract is with the hotel. The OTA may assist but is generally not legally liable for the hotel's failures.\n\nFor credit card payments over £100, <strong>Section 75 of the Consumer Credit Act 1974</strong> makes your credit card provider jointly liable — useful if the hotel has ceased trading or refuses to engage.`,
    urgency: 'low',
    actions: [
      { title: 'Raise the issue with hotel management during your stay', detail: 'Always complain in writing (email to the manager) during your stay and request a remedy. If you leave without complaining, it weakens your claim significantly.', urgent: false },
      { title: 'Document everything thoroughly', detail: 'Photograph every issue — dirty rooms, broken facilities, signage about unavailable amenities. Save screenshots of what was advertised vs what you found on arrival.', urgent: false },
      { title: 'Submit a formal complaint to the hotel after returning', detail: 'Write to the hotel\'s head office or complaints team. For package holidays, write to the tour operator. Set out the specific failures and the compensation or refund you are seeking.', urgent: false },
      { title: 'Use Section 75 or chargeback if paid by card', detail: 'For credit card payments over £100, raise a Section 75 claim with your card provider. For debit cards, request a chargeback within 120 days of payment.', urgent: false },
      { title: 'Refer to ABTA or ATOL if a package holiday', detail: 'If your package holiday was ABTA-registered, you can use ABTA\'s dispute resolution service (abta.com). ATOL protects you if the company becomes insolvent.', urgent: false },
    ],
    evidence: [
      'Booking confirmation showing what was advertised',
      'Screenshots of the hotel website or brochure description',
      'Photographs and videos of the issues during your stay',
      'Written complaints made to hotel management during your stay',
      'Hotel responses to complaints made during the stay',
      'Receipts for any alternative costs incurred',
      'Credit card statement showing payment method',
    ],
    letterType: 'hotel_complaint_letter',
  },

  holiday_cancel: {
    title: 'Holiday Cancellation Refund',
    rights: `Your rights on cancellation depend on how the holiday was booked:\n\n<strong>ATOL-protected package holidays</strong>: Under the <strong>Package Travel and Linked Travel Arrangements Regulations 2018</strong>, if the organiser cancels, you are entitled to a <strong>full refund within 14 days</strong>. You do not have to accept a credit note. ATOL protection also means you will not lose money if the company becomes insolvent.\n\n<strong>Operator-cancelled packages</strong>: You are also entitled to compensation if cancelled less than 14 days before departure (unless extraordinary circumstances apply), on the same scale as flight delay compensation.\n\n<strong>Separate bookings</strong> (not a package): Each element (flight, hotel) must be claimed separately under the relevant rules.\n\n<strong>Self-cancellation</strong>: Your rights depend on the booking terms and conditions. Travel insurance may cover you if you have a valid reason.\n\nThe <strong>Competition and Markets Authority (CMA)</strong> has confirmed that consumers are entitled to cash refunds — not just vouchers — for cancelled holidays.`,
    urgency: 'medium',
    actions: [
      { title: 'Demand a full cash refund in writing', detail: 'Write to the travel company citing the Package Travel Regulations 2018. State clearly that you are not accepting a credit note or voucher and require a cash refund within 14 days.', urgent: false },
      { title: 'Check your ATOL protection', detail: 'If your package is ATOL-protected and the company has become insolvent, contact the CAA\'s ATOL team (caa.co.uk/atol) to make a claim. ATOL certificates are issued at the time of booking.', urgent: false },
      { title: 'Use Section 75 or chargeback if refund not received', detail: 'If paid by credit card (over £100), raise a Section 75 claim with your card provider. For debit cards, request a chargeback. Both can be used if the company refuses to refund.', urgent: false },
      { title: 'Raise a complaint with ABTA', detail: 'If the operator is ABTA-registered, use ABTA\'s dispute resolution service at abta.com. ABTA can mediate and arbitrate disputes between consumers and travel companies.', urgent: false },
      { title: 'Issue a small claims court claim', detail: 'For amounts up to £10,000, file at gov.uk/make-court-claim-for-money. Cite the Package Travel Regulations 2018 or Consumer Rights Act 2015 as appropriate.', urgent: false },
    ],
    evidence: [
      'Original booking confirmation and ATOL certificate',
      'Cancellation notification from the travel company',
      'Any vouchers or credit notes offered (keep but do not accept)',
      'Your written refund demand and the company\'s response',
      'Credit card or bank statement showing payment',
      'Travel insurance policy if claiming through insurance',
      'FCO travel advice if relevant to cancellation reason',
    ],
    letterType: 'holiday_cancel_letter',
  },

  lost_luggage: {
    title: 'Lost Luggage Claim',
    rights: `Lost, delayed, and damaged baggage on international flights is governed by the <strong>Montreal Convention 1999</strong>, which has the force of law in the UK.\n\nKey rights:\n• <strong>Lost luggage</strong>: Airline is liable up to approximately <strong>1,288 Special Drawing Rights (SDR)</strong> — roughly £1,400–£1,500 — per passenger. Luggage is deemed lost after 21 days.\n• <strong>Delayed baggage</strong>: You can claim reasonable expenses for essential items purchased while waiting. Keep all receipts.\n• <strong>Damaged baggage</strong>: Airline is liable up to the same SDR limit. Must be reported at the airport before leaving — ideally within 7 days for damage.\n\nStrict time limits:\n• Damaged baggage: report <strong>within 7 days</strong>\n• Delayed baggage: claim <strong>within 21 days</strong> of receipt\n• Lost baggage: claim <strong>within 2 years</strong> of scheduled arrival\n\nAlways complete a <strong>Property Irregularity Report (PIR)</strong> at the airport — without this, claims are very difficult.`,
    urgency: 'medium',
    actions: [
      { title: 'Complete a Property Irregularity Report (PIR) at the airport', detail: 'Before leaving the baggage hall, report to the airline\'s baggage desk and complete a PIR. Get a copy with a reference number. This is essential for any claim.', urgent: true },
